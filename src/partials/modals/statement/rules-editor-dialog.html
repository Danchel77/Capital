<!-- Модальное окно редактора словаря категорий -->
<div
  id="rules-editor-dialog"
  class="fixed inset-0 bg-black/85 z-[160] hidden flex flex-col justify-end sm:justify-center items-center p-0 sm:p-4 backdrop-blur-sm animate-fade-in"
  onclick="if (event.target === this) closeRulesEditorModal();"
>
  <div
    class="bg-[#0E1016] border border-white/[0.08] w-full max-w-lg rounded-t-[28px] sm:rounded-3xl shadow-2xl flex flex-col h-[92vh] max-h-[92vh] sm:h-[88vh] overflow-hidden"
  >
    <!-- Шапка модального окна -->
    <div
      class="p-4 sm:p-5 border-b border-white/[0.06] bg-[#0E1016] z-20 flex-shrink-0 flex items-center justify-between"
    >
      <div class="flex items-center gap-3">
        <div
          class="w-10 h-10 rounded-2xl bg-white/[0.05] border border-white/[0.08] flex items-center justify-center text-white shadow-sm flex-shrink-0"
        >
          <i data-lucide="book-open-check" class="w-5 h-5"></i>
        </div>
        <div>
          <h3 class="font-bold text-white text-base leading-tight">Словарь категорий</h3>
          <p class="text-[11px] text-zinc-400 mt-0.5">
            Автоматическое определение категорий по названию магазина
          </p>
        </div>
      </div>
      <button
        type="button"
        onclick="closeRulesEditorModal()"
        class="w-8 h-8 rounded-xl bg-white/[0.05] hover:bg-white/10 border border-white/[0.08] text-zinc-400 hover:text-white flex items-center justify-center cursor-pointer transition-colors active:scale-95"
        title="Закрыть"
      >
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>

    <!-- Скроллируемая область формы и списка правил -->
    <div class="flex-1 overflow-y-auto p-4 sm:p-5 space-y-4 bg-[#000000] custom-scrollbar">
      <!-- Добавление нового правила в словарь -->
      <div class="p-3.5 bg-[#0E1016] border border-white/[0.06] rounded-2xl space-y-2.5">
        <span class="text-[10px] text-zinc-400 uppercase font-bold tracking-wider block"
          >Добавить фразу в словарь</span
        >
        <div class="flex flex-col sm:flex-row gap-2 w-full">
          <input
            type="text"
            id="editor-keyword-input"
            placeholder="Название магазина или фраза"
            class="w-full flex-1 bg-[#12151C] border border-white/[0.08] focus:border-white/30 text-white rounded-xl px-3 py-2.5 text-xs outline-none transition-colors min-w-0 font-medium placeholder-zinc-500"
          />

          <div
            class="relative w-full sm:w-44 flex-shrink-0 custom-dropdown-wrap"
            id="wrap-editor-cat"
          >
            <input type="hidden" id="editor-category-input" />
            <button
              type="button"
              id="editor-category-btn"
              onclick="toggleModalCatMenu('editor')"
              class="w-full bg-[#12151C] border border-white/[0.08] focus:border-white/30 text-white rounded-xl px-3 py-2.5 text-xs flex items-center justify-between outline-none cursor-pointer hover:border-white/20 transition-colors"
            >
              <span id="editor-category-label" class="truncate flex items-center gap-1.5"
                >Категория...</span
              >
              <i
                data-lucide="chevron-down"
                class="w-3.5 h-3.5 text-zinc-400 flex-shrink-0 ml-1"
              ></i>
            </button>
            <div
              id="editor-category-menu"
              class="custom-dropdown-menu hidden absolute left-0 top-full mt-1.5 w-full max-h-48 overflow-y-auto bg-[#12151C] border border-white/10 rounded-2xl shadow-2xl z-[170] p-1.5 space-y-0.5 backdrop-blur-xl"
            ></div>
          </div>
        </div>
        <button
          type="button"
          onclick="addRuleFromEditor()"
          class="w-full bg-white text-zinc-950 hover:bg-zinc-200 py-2.5 rounded-xl text-xs font-semibold transition-all active:scale-95 shadow-md cursor-pointer flex items-center justify-center gap-1.5"
        >
          <i data-lucide="plus" class="w-3.5 h-3.5"></i>
          <span>Добавить в словарь</span>
        </button>
      </div>

      <!-- Список слов с группировкой по категориям -->
      <div id="editor-rules-list" class="space-y-3 pr-0.5">
        <!-- Сюда динамически выводятся карточки -->
      </div>
    </div>

    <!-- Подвал -->
    <div
      class="p-3.5 sm:p-4 border-t border-white/[0.06] bg-[#0E1016] flex justify-between items-center gap-2 flex-shrink-0"
    >
      <button
        type="button"
        onclick="restoreDefaultRules()"
        class="text-xs text-zinc-400 hover:text-white px-3 py-2 rounded-xl bg-white/[0.05] hover:bg-white/10 border border-white/[0.08] transition-colors cursor-pointer flex items-center gap-1.5 active:scale-95"
        title="Вернуть исходные системные правила"
      >
        <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
        <span>Сбросить</span>
      </button>
      <button
        type="button"
        onclick="closeRulesEditorModal()"
        class="bg-white text-zinc-950 font-semibold px-5 py-2.5 rounded-xl text-xs shadow-md transition-all active:scale-95 cursor-pointer"
      >
        Готово
      </button>
    </div>
  </div>
</div>
