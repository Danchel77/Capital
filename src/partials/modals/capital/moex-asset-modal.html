<!-- МОДАЛКА: ДОБАВЛЕНИЕ / РЕДАКТИРОВАНИЕ АКТИВА -->
<div
  id="moex-asset-modal"
  class="fixed inset-0 bg-black/80 z-[120] hidden flex flex-col justify-center items-center p-4 backdrop-blur-sm animate-fade-in"
  onclick="if (event.target === this) closeMoexAssetModal();"
>
  <div
    class="bg-[#0E1016] border border-white/10 w-full max-w-md rounded-2xl p-5 shadow-2xl relative"
    onclick="event.stopPropagation()"
  >
    <div class="flex items-center justify-between mb-3.5">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-xl bg-white/[0.06] text-white flex items-center justify-center">
          <i data-lucide="trending-up" class="w-4 h-4"></i>
        </div>
        <h3 id="moex-modal-title" class="text-base font-bold text-white">Добавить в портфель</h3>
      </div>
      <button
        type="button"
        onclick="closeMoexAssetModal()"
        class="w-8 h-8 rounded-full bg-white/[0.06] hover:bg-white/10 text-zinc-400 hover:text-white flex items-center justify-center cursor-pointer transition-colors text-xs"
        title="Закрыть"
      >
        ✕
      </button>
    </div>

    <!-- Переключатель типа актива: Ценная бумага / Свободные рубли -->
    <div
      class="grid grid-cols-2 bg-[#12151C] p-0.5 rounded-xl border border-white/[0.06] gap-1 mb-3.5"
    >
      <button
        type="button"
        id="tab-moex-security"
        onclick="setMoexModalMode('security')"
        class="py-1.5 px-2 rounded-lg text-xs font-semibold bg-white text-zinc-950 transition-all cursor-pointer"
      >
        Ценная бумага
      </button>
      <button
        type="button"
        id="tab-moex-cash"
        onclick="setMoexModalMode('cash')"
        class="py-1.5 px-2 rounded-lg text-xs font-medium text-zinc-400 hover:text-white transition-all cursor-pointer"
      >
        Свободные рубли
      </button>
    </div>

    <form id="moex-asset-form" onsubmit="submitMoexAsset(event)" class="space-y-3.5">
      <input type="hidden" id="moex-asset-id" value="" />
      <input type="hidden" id="moex-asset-type" value="stock" />

      <!-- БЛОК 1: ДЛЯ ЦЕННЫХ БУМАГ (МОСКОВСКАЯ БИРЖА) -->
      <div id="moex-security-fields" class="space-y-3.5">
        <!-- Поиск бумаги -->
        <div class="relative">
          <label class="block text-[10px] text-zinc-400 uppercase tracking-wider font-semibold mb-1"
            >Поиск бумаги на Мосбирже</label
          >
          <div class="relative">
            <input
              type="text"
              id="moex-asset-search"
              placeholder="SBER, LKOH, TMOS, LQDT..."
              autocomplete="off"
              oninput="handleMoexSearchInput(this.value)"
              class="w-full bg-[#12151C] border border-white/10 focus:border-white/30 text-white rounded-xl px-3 py-2 text-xs outline-none uppercase font-mono"
            />
            <div id="moex-search-spinner" class="hidden absolute right-3 top-2.5">
              <i data-lucide="loader-2" class="w-3.5 h-3.5 text-zinc-400 animate-spin"></i>
            </div>
          </div>
          <!-- Выпадающий список результатов поиска -->
          <div
            id="moex-search-results"
            class="hidden absolute left-0 right-0 top-full mt-1 bg-[#12151C] border border-white/10 rounded-xl shadow-2xl z-50 max-h-48 overflow-y-auto custom-scrollbar divide-y divide-white/5"
          ></div>
        </div>

        <!-- Выбранная бумага (карточка подтверждения) -->
        <div
          id="moex-selected-preview"
          class="hidden p-3 rounded-xl bg-[#12151C] border border-white/10 flex items-center justify-between"
        >
          <div class="min-w-0">
            <div class="flex items-center gap-1.5">
              <b id="moex-preview-ticker" class="text-white text-xs font-mono font-bold">SBER</b>
              <span
                id="moex-preview-badge"
                class="text-[9px] px-1.5 py-0.5 rounded font-semibold bg-white/10 text-zinc-300"
                >Акция</span
              >
            </div>
            <p id="moex-preview-name" class="text-[11px] text-zinc-400 truncate mt-0.5">Сбербанк</p>
          </div>
          <div class="text-right">
            <span class="text-[10px] text-zinc-400 block">Котировка</span>
            <b id="moex-preview-price" class="text-xs text-white font-mono">0 ₽</b>
          </div>
        </div>

        <!-- Количество штук -->
        <div>
          <label class="block text-[10px] text-zinc-400 uppercase tracking-wider font-semibold mb-1"
            >Количество (шт.)</label
          >
          <input
            type="number"
            id="moex-asset-qty"
            step="any"
            min="0.0001"
            placeholder="10"
            oninput="updateMoexAssetCalculations()"
            class="w-full bg-[#12151C] border border-white/10 focus:border-white/30 text-white rounded-xl px-3 py-2 text-xs font-mono font-bold outline-none"
          />
        </div>

        <!-- Средняя цена покупки (опционально) -->
        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="block text-[10px] text-zinc-400 uppercase tracking-wider font-semibold"
              >Цена покупки (₽/шт.)</label
            >
            <span class="text-[10px] text-zinc-400">Опционально</span>
          </div>
          <input
            type="text"
            inputmode="decimal"
            id="moex-asset-buy-price"
            placeholder="Для истории сделки"
            oninput="
              formatSumInput(this);
              updateMoexAssetCalculations();
            "
            class="w-full bg-[#12151C] border border-white/10 focus:border-white/30 text-white rounded-xl px-3 py-2 text-xs font-mono outline-none"
          />
        </div>
      </div>

      <!-- БЛОК 2: ДЛЯ СВОБОДНЫХ ДЕНЕГ (КЭШ В РУБЛЯХ) -->
      <div id="moex-cash-fields" class="hidden space-y-3.5">
        <div>
          <label class="block text-[10px] text-zinc-400 uppercase tracking-wider font-semibold mb-1"
            >Свободная сумма в портфеле (₽)</label
          >
          <input
            type="text"
            inputmode="decimal"
            id="moex-cash-amount"
            placeholder="0 ₽"
            oninput="
              formatSumInput(this);
              updateMoexAssetCalculations();
            "
            class="w-full bg-[#12151C] border border-white/10 focus:border-white/30 text-white rounded-xl px-3 py-2.5 text-sm font-mono font-bold outline-none"
          />
        </div>
        <div>
          <label class="block text-[10px] text-zinc-400 uppercase tracking-wider font-semibold mb-1"
            >Название счета / остатка</label
          >
          <input
            type="text"
            id="moex-cash-name"
            value="Свободные рубли"
            placeholder="Например: Рубли (кэш), Остаток на счете"
            class="w-full bg-[#12151C] border border-white/10 focus:border-white/30 text-white rounded-xl px-3 py-2 text-xs outline-none"
          />
        </div>
      </div>

      <!-- Итог позиции -->
      <div
        class="p-3 rounded-xl bg-[#12151C] border border-white/10 flex items-center justify-between text-xs"
      >
        <span class="text-zinc-400">Стоимость позиции:</span>
        <b id="moex-asset-total-value" class="text-sm font-bold text-white font-mono">0 ₽</b>
      </div>

      <!-- Кнопки действий -->
      <div class="flex gap-2 pt-2">
        <button
          type="button"
          id="moex-asset-delete-btn"
          onclick="deleteCurrentMoexAsset()"
          class="hidden py-2.5 px-3 rounded-xl bg-rose-500/15 hover:bg-rose-500/25 active:scale-95 text-rose-300 text-xs font-semibold transition-all border border-rose-500/30 cursor-pointer"
        >
          Удалить
        </button>
        <button
          type="button"
          onclick="closeMoexAssetModal()"
          class="flex-1 py-2.5 px-3 rounded-xl bg-white/[0.06] hover:bg-white/10 active:scale-95 text-zinc-300 text-xs font-semibold transition-all cursor-pointer"
        >
          Отмена
        </button>
        <button
          type="submit"
          id="moex-asset-save-btn"
          class="flex-1 py-2.5 px-3 rounded-xl bg-white hover:bg-zinc-200 active:scale-95 text-zinc-950 text-xs font-semibold transition-all shadow-sm cursor-pointer"
        >
          Сохранить
        </button>
      </div>
    </form>
  </div>
</div>
