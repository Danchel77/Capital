<!-- МОДАЛЬНОЕ ОКНО: СМЕНА ЛОГИНА -->
<div
  id="change-login-dialog"
  class="fixed inset-0 bg-black/90 z-[160] hidden flex flex-col justify-center items-center p-4 backdrop-blur-md animate-fade-in"
  onclick="if (event.target === this) closeChangeLoginModal();"
>
  <div
    class="bg-[#0E1016] border border-white/[0.06] w-full max-w-sm rounded-3xl p-5 shadow-2xl flex flex-col space-y-4"
  >
    <div>
      <h3 class="text-base font-bold text-white">Смена логина</h3>
      <p class="text-xs text-zinc-500 mt-0.5">
        Текущий: <span id="change-login-current" class="text-zinc-300 font-mono"></span>
      </p>
    </div>

    <div class="space-y-3.5">
      <div class="space-y-1.5">
        <label class="block text-[11px] text-zinc-400 font-medium">Новый логин</label>
        <input
          type="text"
          id="change-login-new"
          autocomplete="username"
          class="w-full bg-[#000000] border border-white/[0.06] focus:border-white/30 text-white rounded-xl px-3 py-2.5 outline-none text-xs transition-colors"
        />
      </div>
      <div class="space-y-1.5">
        <label class="block text-[11px] text-zinc-400 font-medium">Текущий пароль</label>
        <input
          type="password"
          id="change-login-password"
          autocomplete="current-password"
          class="w-full bg-[#000000] border border-white/[0.06] focus:border-white/30 text-white rounded-xl px-3 py-2.5 outline-none text-xs transition-colors"
        />
      </div>

      <div class="flex gap-2 pt-1">
        <button
          type="button"
          onclick="closeChangeLoginModal()"
          class="flex-1 py-2.5 px-3 rounded-xl bg-white/[0.04] hover:bg-white/[0.08] text-zinc-400 hover:text-white border border-white/[0.06] text-xs font-semibold cursor-pointer transition-colors"
        >
          Отмена
        </button>
        <button
          type="button"
          id="change-login-submit-btn"
          onclick="submitChangeLogin()"
          class="flex-1 py-2.5 px-3 rounded-xl bg-white text-zinc-950 hover:bg-zinc-200 active:scale-95 text-xs font-semibold shadow-sm cursor-pointer transition-all flex items-center justify-center"
        >
          <span>Сохранить</span>
        </button>
      </div>
    </div>
  </div>
</div>
