<!-- МОДАЛЬНОЕ ОКНО: ВЫБОР ВЕКТОРНОГО АВАТАРА -->
<div
  id="avatar-picker-dialog"
  class="fixed inset-0 bg-black/80 z-[160] hidden flex flex-col justify-center items-center p-4 backdrop-blur-sm animate-fade-in"
  onclick="if (event.target === this) closeAvatarPickerModal();"
>
  <div
    class="bg-[#181B24] border border-[rgba(255,255,255,0.08)] w-full max-w-md rounded-3xl p-6 shadow-2xl flex flex-col max-h-[90vh]"
  >
    <div
      class="flex items-center justify-between mb-4 pb-2 border-b border-[rgba(255,255,255,0.06)]"
    >
      <div>
        <h3 class="text-lg font-bold text-white">Выбор аватарки</h3>
        <p class="text-xs text-gray-400 mt-0.5">Стильный векторный значок для вас и транзакций</p>
      </div>
      <button
        type="button"
        onclick="closeAvatarPickerModal()"
        class="text-gray-400 hover:text-white p-1 rounded-lg hover:bg-[#212430] cursor-pointer"
      >
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>

    <!-- Сетка 16 векторных аватаров -->
    <div id="avatar-picker-grid" class="grid grid-cols-4 gap-3 overflow-y-auto p-1 max-h-[380px]">
      <!-- Рендерится динамически -->
    </div>

    <div class="flex gap-2.5 mt-5 pt-3 border-t border-[rgba(255,255,255,0.06)]">
      <button
        type="button"
        onclick="closeAvatarPickerModal()"
        class="flex-1 bg-[#212430] hover:bg-[#2A2D3C] text-gray-300 py-3 rounded-xl text-xs font-semibold cursor-pointer transition-colors"
      >
        Отмена
      </button>
      <button
        type="button"
        onclick="applySelectedAvatar()"
        class="flex-1 bg-[#6C5DD3] hover:bg-[#5E4FC9] text-white py-3 rounded-xl text-xs font-semibold shadow-md shadow-[#6C5DD3]/25 active:scale-95 cursor-pointer transition-all flex items-center justify-center gap-1.5"
      >
        <i data-lucide="check" class="w-4 h-4"></i>
        <span>Применить</span>
      </button>
    </div>
  </div>
</div>
