<!-- МОДАЛЬНОЕ ОКНО: ВЫБОР ВЕКТОРНОГО АВАТАРА -->
<div
  id="avatar-picker-dialog"
  class="fixed inset-0 bg-black/90 z-[160] hidden flex flex-col justify-center items-center p-4 backdrop-blur-md animate-fade-in"
  onclick="if (event.target === this) closeAvatarPickerModal();"
>
  <div
    class="bg-[#0E1016] border border-white/[0.06] w-full max-w-sm rounded-3xl p-5 shadow-2xl flex flex-col max-h-[90vh]"
  >
    <div class="flex items-center justify-between mb-4 pb-3 border-b border-white/[0.06]">
      <div>
        <h3 class="text-base font-bold text-white">Выбор аватара</h3>
        <p class="text-xs text-zinc-500 mt-0.5">Выберите значок профиля</p>
      </div>
      <button
        type="button"
        onclick="closeAvatarPickerModal()"
        class="w-8 h-8 rounded-xl bg-white/[0.04] hover:bg-white/[0.08] active:scale-95 text-zinc-400 hover:text-white border border-white/[0.06] flex items-center justify-center cursor-pointer transition-all"
      >
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>

    <!-- Сетка векторных аватаров -->
    <div id="avatar-picker-grid" class="grid grid-cols-4 gap-2.5 overflow-y-auto p-1 max-h-[340px]">
      <!-- Рендерится динамически -->
    </div>

    <div class="flex gap-2.5 mt-4 pt-3 border-t border-white/[0.06]">
      <button
        type="button"
        onclick="closeAvatarPickerModal()"
        class="flex-1 bg-white/[0.04] hover:bg-white/[0.08] border border-white/[0.06] text-zinc-300 py-2.5 rounded-xl text-xs font-semibold cursor-pointer transition-colors active:scale-95"
      >
        Отмена
      </button>
      <button
        type="button"
        onclick="applySelectedAvatar()"
        class="flex-1 bg-white hover:bg-zinc-200 text-zinc-950 py-2.5 rounded-xl text-xs font-semibold shadow-sm active:scale-95 cursor-pointer transition-all flex items-center justify-center gap-1.5"
      >
        <i data-lucide="check" class="w-4 h-4"></i>
        <span>Применить</span>
      </button>
    </div>
  </div>
</div>
