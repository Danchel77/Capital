<!-- Модальное окно Личного кабинета -->
<div
  id="profile-dialog"
  class="fixed inset-0 bg-black/95 backdrop-blur-md z-[150] hidden flex flex-col items-center justify-start overflow-y-auto overscroll-contain custom-scrollbar animate-fade-in p-0 sm:py-6 sm:px-4"
  onclick="if (event.target === this) closeProfileModal();"
>
  <div
    class="w-full max-w-[540px] mx-auto min-h-full sm:min-h-0 bg-[#000000] sm:bg-[#0E1016] border-x sm:border border-white/[0.06] sm:rounded-3xl shadow-2xl flex flex-col relative pb-safe"
  >
    <!-- Закрепленная верхняя панель (Sticky Header) -->
    <div
      class="modal-sticky-header bg-[#000000] sm:bg-[#0E1016] px-4 sm:px-6 py-3.5 border-b border-white/[0.06] sm:rounded-t-3xl flex items-center justify-between shadow-sm z-10"
    >
      <h2 class="text-base sm:text-lg font-bold tracking-tight text-white leading-tight">
        Личный кабинет
      </h2>
      <button
        type="button"
        onclick="closeProfileModal()"
        class="w-8 h-8 rounded-xl bg-white/[0.04] hover:bg-white/[0.08] active:scale-95 text-zinc-400 hover:text-white border border-white/[0.06] flex items-center justify-center cursor-pointer transition-all flex-shrink-0"
        title="Закрыть"
      >
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>

    <div class="flex-1 p-4 sm:p-5 space-y-3.5">
      <!-- 1. Карточка пользователя с аватаром -->
      <div
        class="p-4 rounded-2xl bg-[#0E1016] border border-white/[0.06] flex items-center gap-3.5"
      >
        <div
          id="profile-avatar-container"
          onclick="openAvatarPickerModal()"
          class="w-14 h-14 rounded-full flex items-center justify-center cursor-pointer active:scale-95 transition-transform overflow-hidden flex-shrink-0"
          title="Нажмите, чтобы выбрать значок"
        >
          <!-- Рендерится getAvatarHtml(...) -->
        </div>

        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 min-w-0">
            <h3
              id="profile-username-display"
              class="text-base font-bold text-white truncate cursor-pointer hover:text-zinc-200"
              onclick="toggleProfileNameEdit()"
              title="Нажмите, чтобы изменить имя"
            >
              Пользователь
            </h3>
            <button
              type="button"
              onclick="toggleProfileNameEdit()"
              class="p-1 rounded-lg text-zinc-500 hover:text-white transition-colors cursor-pointer active:scale-95 flex-shrink-0"
              title="Редактировать имя"
            >
              <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
            </button>
          </div>
          <p id="profile-auth-type" class="text-xs text-zinc-500 font-mono mt-0.5 truncate">
            user@budget.local
          </p>

          <!-- Раскрывающееся поле изменения имени -->
          <div id="profile-edit-name-row" class="mt-2.5 hidden flex items-center gap-2">
            <div class="relative flex-1 min-w-0">
              <input
                type="text"
                id="profile-edit-name-input"
                placeholder="Ваше имя"
                maxlength="30"
                onkeydown="if (event.key === 'Enter') saveProfileInfo(true);"
                class="w-full bg-[#000000] border border-white/10 focus:border-white/30 text-white rounded-xl px-3 py-1.5 text-xs outline-none transition-colors"
              />
            </div>
            <button
              type="button"
              onclick="saveProfileInfo(true)"
              class="px-3 py-1.5 bg-white text-zinc-950 text-xs font-semibold rounded-xl cursor-pointer transition-all active:scale-95 shadow-sm flex items-center gap-1 flex-shrink-0"
            >
              <i data-lucide="check" class="w-3.5 h-3.5"></i>
              <span>Готово</span>
            </button>
            <button
              type="button"
              onclick="toggleProfileNameEdit(false)"
              class="p-1.5 text-zinc-400 hover:text-white bg-[#000000] border border-white/10 rounded-xl cursor-pointer transition-colors flex-shrink-0"
              title="Отмена"
            >
              <i data-lucide="x" class="w-3.5 h-3.5"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- 2. СЕКЦИЯ: СЕМЕЙНЫЙ БЮДЖЕТ -->
      <div id="family-section-container">
        <!-- Динамически рендерится функцией renderFamilySettingsUI() -->
      </div>

      <!-- 3. СЕКЦИЯ: БЕЗОПАСНОСТЬ И АККАУНТ -->
      <div
        class="bg-[#0E1016] border border-white/[0.06] rounded-2xl overflow-hidden divide-y divide-white/[0.04]"
      >
        <div class="py-2.5 px-4 bg-white/[0.02]">
          <span class="text-[11px] font-semibold text-zinc-500 uppercase tracking-wider block"
            >Безопасность и аккаунт</span
          >
        </div>

        <button
          type="button"
          onclick="openChangeLoginModal()"
          class="w-full flex items-center justify-between p-3.5 hover:bg-white/[0.02] active:bg-white/[0.04] transition-colors cursor-pointer text-left"
        >
          <div class="flex items-center gap-3">
            <div
              class="w-10 h-10 rounded-xl bg-sky-500/10 border border-sky-500/20 text-sky-400 flex items-center justify-center flex-shrink-0"
            >
              <i data-lucide="user-pen" class="w-5 h-5"></i>
            </div>
            <span class="text-sm font-medium text-white block">Сменить логин</span>
          </div>
          <i data-lucide="chevron-right" class="w-4 h-4 text-zinc-600"></i>
        </button>

        <button
          type="button"
          onclick="openChangePasswordModal()"
          class="w-full flex items-center justify-between p-3.5 hover:bg-white/[0.02] active:bg-white/[0.04] transition-colors cursor-pointer text-left"
        >
          <div class="flex items-center gap-3">
            <div
              class="w-10 h-10 rounded-xl bg-amber-500/10 border border-amber-500/20 text-amber-400 flex items-center justify-center flex-shrink-0"
            >
              <i data-lucide="key" class="w-5 h-5"></i>
            </div>
            <span class="text-sm font-medium text-white block">Сменить пароль</span>
          </div>
          <i data-lucide="chevron-right" class="w-4 h-4 text-zinc-600"></i>
        </button>
      </div>

      <!-- 4. СЕКЦИЯ: ДАННЫЕ И ИНСТРУМЕНТЫ -->
      <div
        class="bg-[#0E1016] border border-white/[0.06] rounded-2xl overflow-hidden divide-y divide-white/[0.04]"
      >
        <div class="py-2.5 px-4 bg-white/[0.02]">
          <span class="text-[11px] font-semibold text-zinc-500 uppercase tracking-wider block"
            >Данные и инструменты</span
          >
        </div>

        <!-- Помощник Gemini -->
        <button
          type="button"
          onclick="openGeminiSetupModal()"
          class="w-full flex items-center justify-between p-3.5 hover:bg-white/[0.02] active:bg-white/[0.04] transition-colors cursor-pointer text-left"
        >
          <div class="flex items-center gap-3">
            <div
              class="w-10 h-10 rounded-xl bg-purple-500/10 border border-purple-500/20 text-purple-400 flex items-center justify-center flex-shrink-0"
            >
              <i data-lucide="bot" class="w-5 h-5"></i>
            </div>
            <div>
              <span class="text-sm font-medium text-white block">Помощник Gemini</span>
              <span class="text-[11px] text-zinc-500 leading-tight block mt-0.5"
                >Очистка и распознавание выписок</span
              >
            </div>
          </div>
          <i data-lucide="chevron-right" class="w-4 h-4 text-zinc-600"></i>
        </button>

        <!-- Словарь категорий -->
        <button
          type="button"
          onclick="openSubModalFromProfile('rules')"
          class="w-full flex items-center justify-between p-3.5 hover:bg-white/[0.02] active:bg-white/[0.04] transition-colors cursor-pointer text-left"
        >
          <div class="flex items-center gap-3">
            <div
              class="w-10 h-10 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 flex items-center justify-center flex-shrink-0"
            >
              <i data-lucide="book-open-check" class="w-5 h-5"></i>
            </div>
            <span class="text-sm font-medium text-white block">Словарь категорий</span>
          </div>
          <i data-lucide="chevron-right" class="w-4 h-4 text-zinc-600"></i>
        </button>

        <!-- Резервное копирование и JSON -->
        <button
          type="button"
          onclick="openDataBackupModal()"
          class="w-full flex items-center justify-between p-3.5 hover:bg-white/[0.02] active:bg-white/[0.04] transition-colors cursor-pointer text-left"
        >
          <div class="flex items-center gap-3">
            <div
              class="w-10 h-10 rounded-xl bg-teal-500/10 border border-teal-500/20 text-teal-400 flex items-center justify-center flex-shrink-0"
            >
              <i data-lucide="database" class="w-5 h-5"></i>
            </div>
            <span class="text-sm font-medium text-white block">Резервное копирование</span>
          </div>
          <i data-lucide="chevron-right" class="w-4 h-4 text-zinc-600"></i>
        </button>
      </div>

      <!-- 5. СЕКЦИЯ: АВТОМАТИЗАЦИЯ И УВЕДОМЛЕНИЯ (ТОЛЬКО ДЛЯ APK) -->
      <div
        id="profile-apk-settings-group"
        class="hidden bg-[#0E1016] border border-white/[0.06] rounded-2xl overflow-hidden divide-y divide-white/[0.04]"
      >
        <div class="py-2.5 px-4 bg-white/[0.02]">
          <span class="text-[11px] font-semibold text-zinc-500 uppercase tracking-wider block"
            >Автоматизация</span
          >
        </div>

        <!-- Уведомления о счетах и вкладах -->
        <div id="profile-notifications-setting-item" class="p-3.5 space-y-2.5">
          <label class="flex items-center justify-between cursor-pointer">
            <div class="flex items-center gap-3">
              <div
                class="w-10 h-10 rounded-xl bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 flex items-center justify-center flex-shrink-0"
              >
                <i data-lucide="bell" class="w-5 h-5"></i>
              </div>
              <span class="text-sm font-medium text-white block">Уведомления о счетах</span>
            </div>
            <div class="relative inline-flex items-center flex-shrink-0 ml-3">
              <input
                type="checkbox"
                id="toggle-notifications-setting"
                onchange="toggleNotificationsSetting(this.checked)"
                class="sr-only peer"
              />
              <div
                class="w-10 h-5 bg-white/10 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:bg-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-zinc-950 peer-checked:after:bg-zinc-950 after:rounded-full after:h-4 after:w-4 after:transition-all"
              ></div>
            </div>
          </label>
          <div
            id="notifications-time-row"
            class="hidden flex items-center justify-between pt-2 border-t border-white/[0.04] text-xs text-zinc-400"
          >
            <span class="text-[11px] text-zinc-500 flex items-center gap-1.5">
              <i data-lucide="clock" class="w-3.5 h-3.5 text-zinc-500"></i> Время напоминаний:
            </span>
            <input
              type="time"
              id="notifications-time-input"
              value="10:00"
              onchange="changeNotificationTimeSetting(this.value)"
              class="bg-[#000000] border border-white/[0.08] hover:border-white/20 focus:border-white/30 text-white rounded-xl px-2.5 py-1 text-xs outline-none cursor-pointer transition-colors font-mono"
            />
          </div>
        </div>

        <!-- Авто-учет по банковским пушам -->
        <button
          id="profile-bank-push-btn"
          type="button"
          onclick="openBankPushModal()"
          class="w-full flex items-center justify-between p-3.5 hover:bg-white/[0.02] active:bg-white/[0.04] transition-colors cursor-pointer text-left"
        >
          <div class="flex items-center gap-3">
            <div
              class="w-10 h-10 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 flex items-center justify-center flex-shrink-0"
            >
              <i data-lucide="bell-ring" class="w-5 h-5"></i>
            </div>
            <span class="text-sm font-medium text-white block">Авто-учет по пушам</span>
          </div>
          <i data-lucide="chevron-right" class="w-4 h-4 text-zinc-600"></i>
        </button>
      </div>

      <!-- 6. СЕКЦИЯ: УСТАНОВКА ПРИЛОЖЕНИЯ (ТОЛЬКО ДЛЯ БРАУЗЕРА / PWA) -->
      <div
        id="profile-install-section"
        class="bg-[#0E1016] border border-white/[0.06] rounded-2xl overflow-hidden divide-y divide-white/[0.04]"
      >
        <button
          id="profile-install-app-btn"
          type="button"
          onclick="openAppInstallOptionsModal()"
          class="w-full flex items-center justify-between p-3.5 hover:bg-white/[0.02] active:bg-white/[0.04] transition-colors cursor-pointer text-left"
        >
          <div class="flex items-center gap-3">
            <div
              class="w-10 h-10 rounded-xl bg-blue-500/10 border border-blue-500/20 text-blue-400 flex items-center justify-center flex-shrink-0"
            >
              <i data-lucide="smartphone" class="w-5 h-5"></i>
            </div>
            <span class="profile-install-title text-sm font-medium text-white block"
              >Установить приложение</span
            >
          </div>
          <i data-lucide="chevron-right" class="w-4 h-4 text-zinc-600"></i>
        </button>
      </div>

      <!-- 7. Деструктивные действия -->
      <div class="pt-2 pb-1 space-y-1 text-center">
        <button
          type="button"
          onclick="
            closeProfileModal();
            logoutUser();
          "
          class="w-full py-2.5 px-3 text-xs text-zinc-400 hover:text-white font-medium cursor-pointer transition-colors active:scale-95 flex items-center justify-center gap-2"
        >
          <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
          <span>Выйти</span>
        </button>
        <button
          type="button"
          onclick="
            closeProfileModal();
            openDeleteAccountModal();
          "
          class="w-full py-2 px-3 text-[11px] text-rose-500/70 hover:text-rose-400 font-medium cursor-pointer transition-colors active:scale-95"
        >
          Удалить аккаунт
        </button>
      </div>
    </div>
  </div>
</div>
