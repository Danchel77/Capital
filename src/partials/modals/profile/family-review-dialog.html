<!-- МОДАЛЬНОЕ ОКНО: ПРЕДЛОЖЕНИЕ ПЕРЕСМОТРА БЮДЖЕТА ПРИ ПОДКЛЮЧЕНИИ НОВОГО ЧЛЕНА СЕМЬИ -->
<div
  id="family-review-dialog"
  class="fixed inset-0 bg-black/90 z-[165] hidden flex flex-col justify-center items-center p-4 backdrop-blur-md animate-fade-in"
  onclick="if (event.target === this) closeFamilyReviewDialog(false);"
>
  <div
    class="bg-[#0E1016] border border-white/[0.06] w-full max-w-sm rounded-3xl p-5 shadow-2xl flex flex-col"
  >
    <div class="flex items-center justify-between mb-4 pb-3 border-b border-white/[0.06]">
      <div class="flex items-center gap-2.5">
        <div
          class="w-10 h-10 rounded-xl bg-white/[0.04] border border-white/[0.06] text-white flex items-center justify-center flex-shrink-0"
        >
          <i data-lucide="users" class="w-5 h-5"></i>
        </div>
        <div>
          <h3 class="text-base font-bold text-white">Новый участник</h3>
          <p class="text-xs text-zinc-500 mt-0.5">В семью вступил новый человек</p>
        </div>
      </div>
      <button
        type="button"
        onclick="closeFamilyReviewDialog(false)"
        class="w-8 h-8 rounded-xl bg-white/[0.04] hover:bg-white/[0.08] active:scale-95 text-zinc-400 hover:text-white border border-white/[0.06] flex items-center justify-center cursor-pointer transition-all"
        title="Закрыть"
      >
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>

    <div class="space-y-3.5">
      <div
        class="flex items-center justify-between p-3 rounded-xl bg-[#000000] border border-white/[0.06]"
      >
        <span class="text-xs text-zinc-400 font-medium">Присоединился:</span>
        <span
          id="family-review-member-name"
          class="text-xs font-semibold text-white truncate max-w-[160px]"
          >Участник</span
        >
      </div>

      <div
        class="bg-[#000000] border border-white/[0.06] rounded-xl overflow-hidden divide-y divide-white/[0.04]"
      >
        <div class="flex items-center gap-3 p-3">
          <div
            class="w-8 h-8 rounded-lg bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 flex items-center justify-center flex-shrink-0"
          >
            <i data-lucide="wallet" class="w-4 h-4"></i>
          </div>
          <div>
            <div class="text-xs font-medium text-white">Доходы семьи</div>
            <div class="text-[11px] text-zinc-500">Объедините доход и источники</div>
          </div>
        </div>

        <div class="flex items-center gap-3 p-3">
          <div
            class="w-8 h-8 rounded-lg bg-sky-500/10 border border-sky-500/20 text-sky-400 flex items-center justify-center flex-shrink-0"
          >
            <i data-lucide="shopping-cart" class="w-4 h-4"></i>
          </div>
          <div>
            <div class="text-xs font-medium text-white">Лимиты расходов</div>
            <div class="text-[11px] text-zinc-500">Скорректируйте категории трат</div>
          </div>
        </div>

        <div class="flex items-center gap-3 p-3">
          <div
            class="w-8 h-8 rounded-lg bg-amber-500/10 border border-amber-500/20 text-amber-400 flex items-center justify-center flex-shrink-0"
          >
            <i data-lucide="target" class="w-4 h-4"></i>
          </div>
          <div>
            <div class="text-xs font-medium text-white">Семейные цели</div>
            <div class="text-[11px] text-zinc-500">Общие финансовые ориентиры</div>
          </div>
        </div>
      </div>

      <div class="space-y-2 pt-2">
        <button
          type="button"
          onclick="confirmFamilyBudgetReview()"
          class="w-full py-2.5 px-3 rounded-xl bg-white text-zinc-950 hover:bg-zinc-200 active:scale-95 text-xs font-semibold shadow-sm cursor-pointer transition-all flex items-center justify-center gap-1.5"
        >
          <i data-lucide="sliders-horizontal" class="w-3.5 h-3.5"></i>
          <span>Настроить семейный бюджет</span>
        </button>
        <button
          type="button"
          onclick="closeFamilyReviewDialog(false)"
          class="w-full py-2 px-3 rounded-xl bg-white/[0.04] hover:bg-white/[0.08] text-zinc-400 hover:text-white border border-white/[0.06] text-xs font-medium active:scale-95 transition-colors cursor-pointer text-center"
        >
          Оставить как есть
        </button>
      </div>
    </div>
  </div>
</div>
