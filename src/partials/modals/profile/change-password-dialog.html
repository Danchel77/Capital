<!-- МОДАЛЬНОЕ ОКНО: СМЕНА ПАРОЛЯ -->
<div
  id="change-password-dialog"
  class="fixed inset-0 bg-black/80 z-[160] hidden flex flex-col justify-center items-center p-4 backdrop-blur-sm animate-fade-in"
  onclick="if (event.target === this) closeChangePasswordModal();"
>
  <div
    class="bg-[#181B24] border border-[rgba(255,255,255,0.08)] w-full max-w-sm rounded-3xl p-6 shadow-2xl"
  >
    <div
      class="flex items-center justify-between mb-4 pb-2 border-b border-[rgba(255,255,255,0.06)]"
    >
      <div>
        <h3 class="text-lg font-bold text-white">Смена пароля</h3>
        <p class="text-xs text-gray-400 mt-0.5">Минимум 6 символов</p>
      </div>
      <button
        type="button"
        onclick="closeChangePasswordModal()"
        class="text-gray-400 hover:text-white p-1 rounded-lg hover:bg-[#212430] cursor-pointer"
      >
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>

    <div class="space-y-3.5">
      <div>
        <label class="block text-[11px] text-[#848D99] uppercase font-bold mb-1.5"
          >Текущий пароль</label
        >
        <input
          type="password"
          id="change-pass-current"
          placeholder="Действующий пароль"
          class="w-full bg-[#12151C] border border-[rgba(255,255,255,0.08)] focus:border-white/30 text-white rounded-xl p-3 outline-none text-sm transition-colors"
        />
      </div>
      <div>
        <label class="block text-[11px] text-[#848D99] uppercase font-bold mb-1.5"
          >Новый пароль</label
        >
        <input
          type="password"
          id="change-pass-new"
          placeholder="От 6 символов"
          class="w-full bg-[#12151C] border border-[rgba(255,255,255,0.08)] focus:border-white/30 text-white rounded-xl p-3 outline-none text-sm transition-colors"
        />
      </div>
      <div>
        <label class="block text-[11px] text-[#848D99] uppercase font-bold mb-1.5"
          >Повторите новый пароль</label
        >
        <input
          type="password"
          id="change-pass-confirm"
          placeholder="Повторите пароль"
          class="w-full bg-[#12151C] border border-[rgba(255,255,255,0.08)] focus:border-white/30 text-white rounded-xl p-3 outline-none text-sm transition-colors"
        />
      </div>

      <div class="flex gap-2.5 pt-2">
        <button
          type="button"
          onclick="closeChangePasswordModal()"
          class="flex-1 bg-[#212430] hover:bg-[#2A2D3C] text-gray-300 py-3 rounded-xl text-xs font-semibold cursor-pointer transition-colors"
        >
          Отмена
        </button>
        <button
          type="button"
          id="change-password-submit-btn"
          onclick="submitChangePassword()"
          class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white py-3 rounded-xl text-xs font-semibold shadow-md active:scale-95 cursor-pointer transition-all flex items-center justify-center gap-1.5"
        >
          <i data-lucide="lock" class="w-3.5 h-3.5"></i>
          <span>Сохранить</span>
        </button>
      </div>
    </div>
  </div>
</div>
