<!-- МОДАЛЬНОЕ ОКНО: ПОДТВЕРЖДЕНИЕ И БЕЗОПАСНОЕ УДАЛЕНИЕ АККАУНТА (БЕЗ РУЧНОГО ВЫХОДА) -->
<div
  id="delete-account-dialog"
  class="fixed inset-0 bg-black/90 z-[160] hidden flex flex-col justify-center items-center p-4 backdrop-blur-md animate-fade-in"
  onclick="if (event.target === this) closeDeleteAccountModal();"
>
  <div class="bg-[#0E1016] border border-white/[0.06] w-full max-w-sm rounded-3xl p-6 shadow-2xl">
    <div
      class="w-12 h-12 rounded-2xl bg-red-500/10 border border-red-500/20 text-red-400 flex items-center justify-center mx-auto mb-3.5"
    >
      <i data-lucide="shield-alert" class="w-6 h-6"></i>
    </div>
    <h3 class="text-base font-bold text-white text-center mb-1">Удаление аккаунта</h3>
    <p class="text-xs text-zinc-500 text-center mb-5">
      Все транзакции, вклады, цели и настройки будут безвозвратно удалены.
    </p>

    <!-- Секция подтверждения паролем для Email / Nickname -->
    <div id="delete-account-pass-section" class="space-y-3.5">
      <div>
        <label class="block text-[11px] text-zinc-400 font-semibold mb-1.5"
          >Текущий пароль для подтверждения</label
        >
        <input
          type="password"
          id="delete-account-password"
          placeholder="Ваш пароль"
          class="w-full bg-[#000000] border border-white/[0.06] focus:border-red-500/50 text-white rounded-xl p-3 outline-none text-xs transition-colors placeholder:text-zinc-600"
        />
      </div>
      <div class="flex gap-2 pt-2">
        <button
          type="button"
          onclick="closeDeleteAccountModal()"
          class="flex-1 bg-white/[0.04] hover:bg-white/[0.08] text-zinc-400 hover:text-white border border-white/[0.06] py-2.5 rounded-xl text-xs font-semibold cursor-pointer transition-colors"
        >
          Отмена
        </button>
        <button
          type="button"
          id="delete-account-confirm-btn"
          onclick="submitDeleteAccountWithPassword()"
          class="flex-1 bg-red-600 hover:bg-red-500 text-white py-2.5 rounded-xl text-xs font-semibold shadow-md active:scale-95 cursor-pointer transition-all flex items-center justify-center gap-1.5"
        >
          <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
          <span>Удалить всё</span>
        </button>
      </div>
    </div>

    <!-- Секция подтверждения через Google -->
    <div id="delete-account-google-section" class="hidden space-y-4">
      <p class="text-xs text-zinc-400 text-center">
        По соображениям безопасности подтвердите действие через Google аккаунт.
      </p>
      <div class="flex gap-2 pt-1">
        <button
          type="button"
          onclick="closeDeleteAccountModal()"
          class="flex-1 bg-white/[0.04] hover:bg-white/[0.08] text-zinc-400 hover:text-white border border-white/[0.06] py-2.5 rounded-xl text-xs font-semibold cursor-pointer transition-colors"
        >
          Отмена
        </button>
        <button
          type="button"
          onclick="submitDeleteAccountWithGoogle()"
          class="flex-1 bg-red-600 hover:bg-red-500 text-white py-2.5 rounded-xl text-xs font-semibold shadow-md active:scale-95 cursor-pointer transition-all flex items-center justify-center gap-1.5"
        >
          <i data-lucide="shield-alert" class="w-3.5 h-3.5"></i>
          <span>Подтвердить</span>
        </button>
      </div>
    </div>
  </div>
</div>
