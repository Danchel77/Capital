<!-- МОДАЛЬНОЕ ОКНО: ПОДТВЕРЖДЕНИЕ И БЕЗОПАСНОЕ УДАЛЕНИЕ АККАУНТА (БЕЗ РУЧНОГО ВЫХОДА) -->
<div
  id="delete-account-dialog"
  class="fixed inset-0 bg-black/90 z-[160] hidden flex flex-col justify-center items-center p-4 backdrop-blur-md animate-fade-in"
  onclick="if (event.target === this) closeDeleteAccountModal();"
>
  <div
    class="bg-[#0E1016] border border-white/[0.06] w-full max-w-sm rounded-3xl p-5 shadow-2xl space-y-4"
  >
    <div>
      <h3 class="text-base font-bold text-white">Удаление аккаунта</h3>
      <p class="text-xs text-zinc-500 mt-1">
        Все операции, вклады, цели и настройки будут безвозвратно удалены.
      </p>
    </div>

    <!-- Секция подтверждения паролем для Email / Nickname -->
    <div id="delete-account-pass-section" class="space-y-3.5">
      <div class="space-y-1.5">
        <label class="block text-[11px] text-zinc-400 font-medium">Текущий пароль</label>
        <input
          type="password"
          id="delete-account-password"
          placeholder="••••••••"
          class="w-full bg-[#000000] border border-white/[0.06] focus:border-rose-500/50 text-white rounded-xl p-2.5 outline-none text-xs transition-colors placeholder:text-zinc-600"
        />
      </div>
      <div class="flex gap-2 pt-1">
        <button
          type="button"
          onclick="closeDeleteAccountModal()"
          class="flex-1 bg-white/[0.04] hover:bg-white/[0.08] text-zinc-400 hover:text-white border border-white/[0.06] py-2.5 rounded-xl text-xs font-semibold cursor-pointer transition-colors"
        >
          Отмена
        </button>
        <button
          type="button"
          id="delete-account-confirm-btn"
          onclick="submitDeleteAccountWithPassword()"
          class="flex-1 bg-rose-600 hover:bg-rose-500 active:scale-95 text-white py-2.5 rounded-xl text-xs font-semibold shadow-md cursor-pointer transition-all flex items-center justify-center"
        >
          <span>Удалить</span>
        </button>
      </div>
    </div>

    <!-- Секция подтверждения через Google -->
    <div id="delete-account-google-section" class="hidden space-y-3.5">
      <p class="text-xs text-zinc-400">
        По соображениям безопасности подтвердите действие через Google аккаунт.
      </p>
      <div class="flex gap-2 pt-1">
        <button
          type="button"
          onclick="closeDeleteAccountModal()"
          class="flex-1 bg-white/[0.04] hover:bg-white/[0.08] text-zinc-400 hover:text-white border border-white/[0.06] py-2.5 rounded-xl text-xs font-semibold cursor-pointer transition-colors"
        >
          Отмена
        </button>
        <button
          type="button"
          onclick="submitDeleteAccountWithGoogle()"
          class="flex-1 bg-rose-600 hover:bg-rose-500 active:scale-95 text-white py-2.5 rounded-xl text-xs font-semibold shadow-md cursor-pointer transition-all flex items-center justify-center"
        >
          <span>Подтвердить</span>
        </button>
      </div>
    </div>
  </div>
</div>
