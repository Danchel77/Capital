<!-- МОДАЛЬНОЕ ОКНО: ПОДКЛЮЧЕНИЕ К СЕМЬЕ ПО КОДУ -->
<div
  id="join-family-dialog"
  class="fixed inset-0 bg-black/90 z-[160] hidden flex flex-col justify-center items-center p-4 backdrop-blur-md animate-fade-in"
  onclick="if (event.target === this) closeJoinFamilyModal();"
>
  <div
    class="bg-[#0E1016] border border-white/[0.06] w-full max-w-sm rounded-3xl p-5 shadow-2xl flex flex-col"
  >
    <div class="flex items-center justify-between mb-4 pb-3 border-b border-white/[0.06]">
      <div class="flex items-center gap-2.5">
        <div
          class="w-10 h-10 rounded-xl bg-white/[0.04] border border-white/[0.06] text-white flex items-center justify-center flex-shrink-0"
        >
          <i data-lucide="key-round" class="w-5 h-5"></i>
        </div>
        <div>
          <h3 class="text-base font-bold text-white">Ввести код семьи</h3>
          <p class="text-xs text-zinc-500 mt-0.5">Присоединение по приглашению</p>
        </div>
      </div>
      <button
        type="button"
        onclick="closeJoinFamilyModal()"
        class="w-8 h-8 rounded-xl bg-white/[0.04] hover:bg-white/[0.08] active:scale-95 text-zinc-400 hover:text-white border border-white/[0.06] flex items-center justify-center cursor-pointer transition-all"
        title="Закрыть"
      >
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>

    <div class="space-y-3.5">
      <div class="space-y-1.5">
        <label class="block text-[11px] text-zinc-400 font-medium">Код приглашения</label>
        <input
          type="text"
          id="join-family-code"
          placeholder="XXXXXX"
          maxlength="12"
          class="w-full bg-[#000000] border border-white/10 rounded-xl px-3 py-2 text-xs text-white placeholder-zinc-600 focus:border-white/30 outline-none uppercase tracking-widest font-mono transition-colors"
        />
      </div>

      <p class="text-[11px] text-zinc-500 leading-normal">
        Введите 6-значный код, который отображается в профиле создателя семейного бюджета.
      </p>

      <div class="flex gap-2 pt-2">
        <button
          type="button"
          onclick="closeJoinFamilyModal()"
          class="flex-1 py-2 px-3 rounded-xl bg-white/[0.04] hover:bg-white/[0.08] text-zinc-300 hover:text-white border border-white/[0.06] text-xs font-semibold cursor-pointer transition-colors"
        >
          Отмена
        </button>
        <button
          type="button"
          id="join-family-submit-btn"
          onclick="submitJoinFamily()"
          class="flex-1 py-2 px-3 rounded-xl bg-white text-zinc-950 hover:bg-zinc-200 active:scale-95 text-xs font-semibold shadow-sm cursor-pointer transition-all flex items-center justify-center gap-1.5"
        >
          <i data-lucide="link-2" class="w-3.5 h-3.5"></i>
          <span>Присоединиться</span>
        </button>
      </div>
    </div>
  </div>
</div>
