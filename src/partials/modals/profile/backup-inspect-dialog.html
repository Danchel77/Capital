<!-- МОДАЛЬНОЕ ОКНО: ДЕТАЛЬНЫЙ ПРОСМОТР И ВЫБОР ЭЛЕМЕНТОВ ДЛЯ ИМПОРТА -->
<div
  id="backup-inspect-dialog"
  class="fixed inset-0 bg-black/90 z-[170] hidden flex flex-col items-center justify-center p-3 sm:p-4 backdrop-blur-md animate-fade-in"
  onclick="if (event.target === this) closeBackupInspectModal();"
>
  <div
    class="w-full max-w-lg bg-[#0E1016] border border-white/[0.06] rounded-3xl p-5 shadow-2xl flex flex-col max-h-[85vh] my-auto"
  >
    <!-- Заголовок -->
    <div class="flex items-center justify-between mb-4 pb-3 border-b border-white/[0.06]">
      <div class="flex items-center gap-2.5 min-w-0">
        <div
          id="backup-inspect-icon-wrap"
          class="w-10 h-10 rounded-xl bg-white/[0.04] border border-white/[0.06] text-white flex items-center justify-center flex-shrink-0"
        >
          <i id="backup-inspect-icon" data-lucide="arrow-left-right" class="w-5 h-5"></i>
        </div>
        <div class="min-w-0">
          <h3 id="backup-inspect-title" class="text-base font-bold text-white truncate">
            Просмотр операций
          </h3>
          <p id="backup-inspect-subtitle" class="text-xs text-zinc-500 truncate mt-0.5">
            Отметьте записи для добавления в базу
          </p>
        </div>
      </div>
      <button
        type="button"
        onclick="closeBackupInspectModal()"
        class="w-8 h-8 rounded-xl bg-white/[0.04] hover:bg-white/[0.08] active:scale-95 text-zinc-400 hover:text-white border border-white/[0.06] flex items-center justify-center cursor-pointer transition-all flex-shrink-0"
        title="Закрыть"
      >
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>

    <!-- Панель фильтрации и переключения выбора -->
    <div class="flex items-center justify-between gap-2 mb-3 flex-wrap">
      <!-- Табы фильтрации -->
      <div class="flex bg-[#000000] p-1 rounded-xl border border-white/[0.06] text-xs font-medium">
        <button
          id="backup-inspect-filter-all"
          type="button"
          onclick="setBackupInspectFilter('all')"
          class="px-2.5 py-1 rounded-lg transition-colors bg-white/10 text-white cursor-pointer"
        >
          Все (<span id="inspect-count-all">0</span>)
        </button>
        <button
          id="backup-inspect-filter-new"
          type="button"
          onclick="setBackupInspectFilter('new')"
          class="px-2.5 py-1 rounded-lg transition-colors text-zinc-400 hover:text-white cursor-pointer"
        >
          Новые (<span id="inspect-count-new">0</span>)
        </button>
        <button
          id="backup-inspect-filter-dup"
          type="button"
          onclick="setBackupInspectFilter('dup')"
          class="px-2.5 py-1 rounded-lg transition-colors text-zinc-400 hover:text-white cursor-pointer"
        >
          Дубликаты (<span id="inspect-count-dup">0</span>)
        </button>
      </div>

      <!-- Кнопка Все / Снять -->
      <button
        type="button"
        id="backup-inspect-toggle-all-btn"
        onclick="toggleBackupInspectAll()"
        class="h-7 bg-[#000000] hover:bg-white/[0.04] text-zinc-300 hover:text-white border border-white/[0.08] text-[11px] font-medium rounded-xl px-2.5 flex items-center justify-center gap-1.5 cursor-pointer transition-all active:scale-95"
        title="Выбрать все / Снять выделение"
      >
        <i
          id="backup-inspect-toggle-all-icon"
          data-lucide="check-check"
          class="w-3.5 h-3.5 text-zinc-400 flex-shrink-0"
        ></i>
        <span id="backup-inspect-toggle-all-label">Все</span>
      </button>
    </div>

    <!-- Список элементов -->
    <div
      id="backup-inspect-list"
      class="flex-1 overflow-y-auto space-y-2 pr-1 custom-scrollbar max-h-[50vh]"
    >
      <!-- Рендерится динамически -->
    </div>

    <!-- Нижняя панель действий -->
    <div class="pt-3 mt-2 border-t border-white/[0.06] flex items-center justify-between gap-3">
      <div class="text-xs text-zinc-400">
        Выбрано:
        <strong id="backup-inspect-selected-summary" class="text-emerald-400 font-semibold"
          >0</strong
        >
      </div>
      <button
        type="button"
        onclick="closeBackupInspectModal()"
        class="py-2 px-4 rounded-xl bg-white text-zinc-950 hover:bg-zinc-200 font-semibold text-xs cursor-pointer transition-all active:scale-95 shadow-sm flex items-center gap-1.5"
      >
        <i data-lucide="check" class="w-4 h-4"></i>
        <span>Готово</span>
      </button>
    </div>
  </div>
</div>
