<!-- ВСПЛЫВАЮЩАЯ ПАНЕЛЬ УСТАНОВКИ PWA ПРИЛОЖЕНИЯ -->
<div
  id="pwa-install-banner"
  class="fixed bottom-[74px] sm:bottom-6 left-3.5 right-3.5 sm:left-auto sm:right-6 sm:w-[380px] z-50 hidden translate-y-10 opacity-0 transition-all duration-300 pointer-events-none select-none"
  onmouseenter="pausePwaTimer()"
  onmouseleave="resumePwaTimer()"
>
  <div
    id="pwa-banner-card"
    class="relative bg-[#161824]/95 backdrop-blur-2xl border border-[rgba(255,255,255,0.14)] rounded-2xl p-4 shadow-[0_16px_40px_rgba(0,0,0,0.7),0_0_24px_rgba(108,93,211,0.22)] pointer-events-auto transition-transform duration-200"
  >
    <!-- Крестик закрытия в правом верхнем углу -->
    <button
      type="button"
      onclick="dismissPwaInstallBannerForToday()"
      class="absolute top-3 right-3 w-7 h-7 rounded-full bg-white/5 hover:bg-white/15 active:scale-90 text-gray-400 hover:text-white flex items-center justify-center transition-all cursor-pointer z-10"
      title="Скрыть на сегодня"
    >
      <i data-lucide="x" class="w-3.5 h-3.5"></i>
    </button>

    <!-- Верхний блок: Полноценная иконка приложения и названия -->
    <div class="flex items-center gap-3.5 pr-8">
      <!-- Нативная иконка приложения в стиле смартфона (squircle с глубокой тенью) -->
      <img
        src="icon-pwa.svg?v=3"
        alt="Иконка приложения"
        class="rounded-[14px] shadow-lg shadow-[#6C5DD3]/35 flex-shrink-0 object-cover"
        style="width: 54px; height: 54px; min-width: 54px; max-width: 54px; aspect-ratio: 1 / 1"
      />

      <!-- Текстовый блок без обрезания -->
      <div class="flex-1 min-w-0">
        <h4 class="text-[15px] font-bold text-white tracking-tight leading-snug">Бюджет</h4>
        <p class="text-xs text-gray-300 font-medium leading-snug mt-0.5">
          Установите на домашний экран
        </p>
      </div>
    </div>

    <!-- Пошаговая микроподсказка Safari iOS (раскрывается только при нажатии на iOS) -->
    <div
      id="pwa-ios-instructions"
      class="hidden mt-3 pt-2.5 border-t border-[rgba(255,255,255,0.08)] text-[11px] text-gray-300 space-y-1 animate-fade-in"
    >
      <div class="flex items-center gap-1.5 text-emerald-400 font-semibold text-[10px]">
        <i data-lucide="smartphone" class="w-3.5 h-3.5"></i>
        <span>Установка на iPhone:</span>
      </div>
      <div class="text-[10px] text-gray-300 leading-tight">
        Нажмите <strong class="text-white">«Поделиться»</strong>
        <i data-lucide="share" class="w-3 h-3 inline text-[#8C7DFF]"></i> внизу Safari и выберите
        <strong class="text-white">«На экран "Домой"»</strong>
        <i data-lucide="plus-square" class="w-3 h-3 inline text-emerald-400"></i>
      </div>
    </div>

    <!-- Нижняя строка: Кнопка «Установить» и ссылка «Больше не показывать» -->
    <div
      class="flex items-center justify-between gap-3 mt-3.5 pt-3 border-t border-[rgba(255,255,255,0.06)]"
    >
      <button
        type="button"
        onclick="dismissPwaInstallBannerPermanently()"
        class="text-[11px] text-[#848D99] hover:text-gray-300 transition-colors cursor-pointer py-1"
      >
        Больше не показывать
      </button>

      <button
        type="button"
        id="pwa-install-action-btn"
        onclick="triggerPwaInstallPrompt()"
        class="py-2 px-4 rounded-xl bg-gradient-to-r from-[#6C5DD3] to-[#8C7DFF] hover:from-[#5e4fc9] hover:to-[#7b6ceb] active:scale-95 text-white text-xs font-bold shadow-md shadow-[#6C5DD3]/30 transition-all cursor-pointer flex items-center gap-1.5 flex-shrink-0"
      >
        <i data-lucide="download" class="w-3.5 h-3.5"></i>
        <span id="pwa-install-btn-text">Установить</span>
      </button>
    </div>

    <!-- 10-секундная полоска автозакрытия -->
    <div class="absolute bottom-0 left-3 right-3 h-[2px] bg-white/5 rounded-full overflow-hidden">
      <div
        id="pwa-progress-bar"
        class="h-full bg-gradient-to-r from-[#6C5DD3] to-[#38BDF8] rounded-full transition-all duration-100 ease-linear"
        style="width: 100%"
      ></div>
    </div>
  </div>
</div>
