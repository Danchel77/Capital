<!-- КАСТОМНЫЙ АККУРАТНЫЙ КАЛЕНДАРЬ-МОДАЛКА -->
<div
  id="custom-datepicker-modal"
  onclick="if (event.target === this) closeCustomDatePicker();"
  class="fixed inset-0 z-[220] hidden bg-black/85 backdrop-blur-sm flex items-center justify-center p-4 animate-fade-in"
>
  <div
    id="custom-datepicker"
    class="bg-[#0E1016] border border-white/10 rounded-3xl shadow-2xl p-4 w-[310px] max-w-full"
  >
    <!-- Строка ручного ввода даты с клавиатуры -->
    <div class="flex items-center gap-1.5 mb-2.5">
      <input
        type="text"
        id="datepicker-manual-input"
        inputmode="numeric"
        placeholder="ДД.ММ.ГГГГ"
        maxlength="10"
        oninput="formatManualDateInput(this)"
        onkeydown="handleManualDateKeydown(event)"
        class="flex-1 bg-[#12151C] border border-white/10 focus:border-white/30 text-white text-xs rounded-xl px-3 py-2 outline-none font-mono transition-colors placeholder-zinc-500"
      />
      <button
        type="button"
        onclick="applyManualDateInput()"
        class="bg-white hover:bg-zinc-200 text-zinc-950 px-3.5 py-2 rounded-xl text-xs font-semibold transition-all active:scale-95 cursor-pointer flex-shrink-0 shadow-sm"
      >
        OK
      </button>
    </div>

    <div class="flex items-center justify-between mb-3 pb-2 border-b border-white/[0.06]">
      <button
        type="button"
        onclick="changeCustomDatePickerMonth(-1)"
        class="w-8 h-8 rounded-xl bg-white/[0.05] hover:bg-white/10 border border-white/[0.06] flex items-center justify-center text-zinc-400 hover:text-white cursor-pointer transition-colors active:scale-90"
        title="Предыдущий месяц"
      >
        <i data-lucide="chevron-left" class="w-4 h-4"></i>
      </button>
      <span id="datepicker-month-year" class="text-xs font-bold text-white tracking-wide">...</span>
      <button
        type="button"
        onclick="changeCustomDatePickerMonth(1)"
        class="w-8 h-8 rounded-xl bg-white/[0.05] hover:bg-white/10 border border-white/[0.06] flex items-center justify-center text-zinc-400 hover:text-white cursor-pointer transition-colors active:scale-90"
        title="Следующий месяц"
      >
        <i data-lucide="chevron-right" class="w-4 h-4"></i>
      </button>
    </div>
    <div class="grid grid-cols-7 gap-1 text-center text-[10px] text-zinc-500 font-bold mb-1.5">
      <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span
      ><span>Вс</span>
    </div>
    <div id="datepicker-days-grid" class="grid grid-cols-7 gap-1 text-center text-xs"></div>
    <div class="mt-3 pt-2.5 border-t border-white/[0.06] flex justify-between items-center text-xs">
      <button
        type="button"
        onclick="selectCustomDatePickerToday()"
        class="text-zinc-400 hover:text-white font-medium cursor-pointer transition-colors text-xs"
      >
        Сегодня
      </button>
      <button
        type="button"
        onclick="closeCustomDatePicker()"
        class="px-3.5 py-1.5 bg-white/[0.05] hover:bg-white/10 text-zinc-300 hover:text-white rounded-xl text-xs font-medium border border-white/[0.08] transition-colors cursor-pointer ml-auto active:scale-95"
      >
        Закрыть
      </button>
    </div>
  </div>
</div>
