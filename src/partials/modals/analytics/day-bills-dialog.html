<!-- МОДАЛЬНОЕ ОКНО: УПРАВЛЕНИЕ ПЛАТЕЖАМИ ВЫБРАННОГО ДНЯ (Obsidian Minimalist) -->
<div
  id="day-bills-dialog"
  class="fixed inset-0 bg-black/80 z-[170] hidden flex flex-col justify-center items-center p-4 backdrop-blur-sm animate-fade-in"
  onclick="if (event.target === this) closeDayBillsModal();"
>
  <div class="bg-[#0E1016] border border-white/10 w-full max-w-xs rounded-2xl p-4 shadow-2xl">
    <div class="flex items-center justify-between pb-2.5 mb-3 border-b border-white/[0.06]">
      <h4 id="day-bills-title" class="text-xs font-bold text-white tracking-tight">
        Счета на число
      </h4>
      <button
        type="button"
        onclick="closeDayBillsModal()"
        class="w-6 h-6 rounded-lg bg-white/[0.05] hover:bg-white/10 text-zinc-400 hover:text-white flex items-center justify-center transition-colors cursor-pointer"
      >
        <i data-lucide="x" class="w-3.5 h-3.5"></i>
      </button>
    </div>
    <div id="day-bills-items-list" class="space-y-2 max-h-48 overflow-y-auto mb-3"></div>
    <button
      type="button"
      id="btn-add-second-bill"
      class="w-full bg-white hover:bg-zinc-100 text-zinc-950 py-2.5 rounded-xl text-xs font-semibold transition-all active:scale-95 cursor-pointer shadow-sm flex items-center justify-center gap-1.5"
    >
      <i data-lucide="plus" class="w-3.5 h-3.5"></i>
      <span>Добавить платеж на этот день</span>
    </button>
  </div>
</div>
