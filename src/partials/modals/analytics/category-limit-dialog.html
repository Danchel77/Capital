<!-- МОДАЛЬНОЕ ОКНО: НАСТРОЙКА ЛИМИТА КАТЕГОРИИ И УЧТЕННЫХ ОПЕРАЦИЙ -->
<div
  id="category-limit-dialog"
  class="fixed inset-0 bg-black/80 z-[170] hidden flex flex-col justify-center items-center p-3 sm:p-4 backdrop-blur-sm animate-fade-in"
  onclick="if (event.target === this) closeCategoryLimitModal();"
>
  <div
    class="bg-[#181B24] border border-[rgba(255,255,255,0.08)] w-full max-w-md rounded-3xl p-4 sm:p-5 shadow-2xl flex flex-col max-h-[90vh]"
  >
    <!-- Шапка -->
    <div
      class="flex items-center justify-between pb-3 mb-3 border-b border-[rgba(255,255,255,0.06)] flex-shrink-0"
    >
      <div class="flex items-center gap-2.5 min-w-0">
        <div
          id="category-limit-icon-wrap"
          class="w-8 h-8 rounded-xl bg-[#212430] text-[#6C5DD3] flex items-center justify-center flex-shrink-0"
        >
          <i id="category-limit-icon" data-lucide="tag" class="w-4 h-4"></i>
        </div>
        <div>
          <h4 id="category-limit-title" class="text-sm font-bold text-white truncate">Категория</h4>
          <p class="text-[10px] text-[#848D99]">Управление лимитом и операциями месяца</p>
        </div>
      </div>
      <button
        type="button"
        onclick="closeCategoryLimitModal()"
        class="w-7 h-7 rounded-full bg-[#212430] text-gray-400 hover:text-white flex items-center justify-center cursor-pointer text-sm"
      >
        ✕
      </button>
    </div>

    <div class="space-y-3 overflow-y-auto pr-1 flex-1 custom-scrollbar">
      <!-- Блок изменения лимита -->
      <div class="bg-[#12151C] border border-[rgba(255,255,255,0.04)] rounded-2xl p-3 space-y-1.5">
        <label class="block text-[10px] text-[#848D99] uppercase font-bold"
          >Месячный лимит (₽)</label
        >
        <div class="flex gap-2">
          <input
            type="text"
            inputmode="decimal"
            oninput="
              formatSumInput(this);
              onCategoryLimitInputChanged();
            "
            id="category-limit-amount"
            placeholder="0 ₽"
            class="flex-1 bg-[#181B24] border border-[rgba(255,255,255,0.08)] text-white font-mono font-bold rounded-xl px-3 py-2 outline-none text-sm focus:border-white/30"
          />
          <button
            type="button"
            onclick="submitCategoryLimit()"
            class="bg-[#6C5DD3] hover:bg-[#5b4ec2] text-white px-3.5 py-2 rounded-xl text-xs font-semibold shadow-md active:scale-95 cursor-pointer whitespace-nowrap"
          >
            Сохранить
          </button>
        </div>
      </div>

      <!-- Сводка учтенных трат -->
      <div class="bg-[#12151C] border border-[rgba(255,255,255,0.04)] rounded-2xl p-3 space-y-2">
        <div class="flex items-center justify-between text-xs">
          <span class="text-[#848D99] font-medium">Учтено в бюджете:</span>
          <span id="category-limit-spent-label" class="font-mono font-bold text-white"
            >0 ₽ <span class="text-[#848D99] font-normal text-[11px]">/ 0 ₽</span></span
          >
        </div>
        <div class="w-full bg-[rgba(255,255,255,0.06)] h-2 rounded-full overflow-hidden">
          <div
            id="category-limit-progress-bar"
            class="bg-[#30D158] h-full rounded-full transition-all duration-300"
            style="width: 0%"
          ></div>
        </div>
        <div class="flex items-center justify-between text-[10px] text-[#848D99]">
          <span id="category-limit-status-hint">В пределах нормы</span>
          <span id="category-limit-pct" class="font-mono font-bold">0%</span>
        </div>
      </div>

      <!-- Список операций текущего месяца -->
      <div class="space-y-1.5 pt-1">
        <div class="flex items-center justify-between px-1">
          <span class="text-[10px] text-[#848D99] uppercase font-bold tracking-wider"
            >Операции за месяц</span
          >
          <span id="category-limit-tx-count" class="text-[10px] text-[#848D99] font-mono font-bold"
            >0 оп.</span
          >
        </div>
        <div class="flex items-center gap-1.5 px-1 text-[10px] text-gray-500">
          <i data-lucide="info" class="w-3 h-3 text-[#727cff]/80 flex-shrink-0"></i>
          <span class="truncate">Снимите галочку, чтобы исключить из лимита</span>
        </div>
        <div id="category-limit-tx-list" class="space-y-1.5"></div>
      </div>
    </div>

    <div
      class="pt-3 border-t border-[rgba(255,255,255,0.06)] mt-2 flex-shrink-0 flex items-center gap-2"
    >
      <button
        type="button"
        id="category-limit-delete-btn"
        onclick="deleteCategoryLimitFromModal()"
        class="hidden px-3.5 h-10 bg-[#FF453A]/15 hover:bg-[#FF453A]/25 text-[#FF453A] border border-[#FF453A]/20 rounded-xl text-xs font-semibold transition-colors cursor-pointer flex items-center justify-center gap-1.5 active:scale-95 flex-shrink-0"
        title="Удалить этот лимит и перенести сумму в Прочие расходы"
      >
        <i data-lucide="trash-2" class="w-4 h-4"></i>
        <span>Удалить лимит</span>
      </button>
      <button
        type="button"
        onclick="closeCategoryLimitModal()"
        class="flex-1 h-10 bg-[#212430] hover:bg-[#2A2D3C] text-gray-300 rounded-xl text-xs font-semibold cursor-pointer transition-colors flex items-center justify-center active:scale-95"
      >
        Готово
      </button>
    </div>
  </div>
</div>
