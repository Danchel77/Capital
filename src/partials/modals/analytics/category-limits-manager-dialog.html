<!-- МОДАЛЬНОЕ ОКНО: РЕДАКТОР ЛИМИТОВ ВСЕХ КАТЕГОРИЙ (ИЗ НАСТРОЕК БЮДЖЕТА) -->
<div
  id="category-limits-manager-dialog"
  class="fixed inset-0 bg-black/80 z-[160] hidden flex flex-col justify-center items-center p-3 sm:p-4 backdrop-blur-sm animate-fade-in"
  onclick="if (event.target === this) closeCategoryLimitsManagerModal();"
>
  <div
    class="bg-[#181B24] border border-[rgba(255,255,255,0.08)] w-full max-w-md rounded-3xl p-4 sm:p-5 shadow-2xl flex flex-col max-h-[90vh]"
  >
    <div
      class="flex items-center justify-between pb-3 mb-3 border-b border-[rgba(255,255,255,0.06)] flex-shrink-0"
    >
      <div class="flex items-center gap-2">
        <i data-lucide="sliders" class="w-4 h-4 text-[#6C5DD3]"></i>
        <h4 class="text-sm font-bold text-white">Лимиты по категориям</h4>
      </div>
      <button
        type="button"
        onclick="closeCategoryLimitsManagerModal()"
        class="w-7 h-7 rounded-full bg-[#212430] text-gray-400 hover:text-white flex items-center justify-center cursor-pointer text-sm"
      >
        ✕
      </button>
    </div>

    <!-- Сводный бейдж суммы -->
    <div
      class="bg-[#12151C] border border-[rgba(255,255,255,0.04)] rounded-2xl p-3 mb-3 flex items-center justify-between flex-shrink-0"
    >
      <div>
        <span class="text-[10px] text-[#848D99] uppercase font-bold block">Сумма всех лимитов</span>
        <p class="text-[10px] text-[#848D99] mt-0.5">
          В неделю:
          <span id="mgr-limits-weekly-estimate" class="text-gray-300 font-mono font-bold"
            >~0 ₽</span
          >
        </p>
      </div>
      <b id="mgr-limits-total" class="text-sm font-bold text-white font-mono">0 ₽/мес</b>
    </div>

    <div class="flex items-center justify-between px-1 mb-2 flex-shrink-0">
      <span class="text-[10px] text-[#848D99] uppercase font-bold">Категории трат</span>
      <button
        type="button"
        onclick="openAddCategoryLimitPicker()"
        class="text-xs text-[#8C7DFF] hover:text-white font-semibold flex items-center gap-1 cursor-pointer"
      >
        <i data-lucide="plus" class="w-3.5 h-3.5"></i>
        <span>Добавить категорию</span>
      </button>
    </div>

    <!-- Список категорий -->
    <div
      id="category-limits-manager-list"
      class="space-y-1.5 overflow-y-auto pr-1 flex-1 custom-scrollbar max-h-[380px]"
    ></div>

    <div class="flex gap-2 pt-3 border-t border-[rgba(255,255,255,0.06)] mt-3 flex-shrink-0">
      <button
        type="button"
        onclick="closeCategoryLimitsManagerModal()"
        class="flex-1 bg-[#212430] text-gray-300 py-2.5 rounded-xl text-xs font-semibold cursor-pointer"
      >
        Отмена
      </button>
      <button
        type="button"
        onclick="saveCategoryLimitsManager()"
        class="flex-1 bg-[#6C5DD3] hover:bg-[#5b4ec2] text-white py-2.5 rounded-xl text-xs font-semibold shadow-md active:scale-95 cursor-pointer"
      >
        Применить
      </button>
    </div>
  </div>
</div>
