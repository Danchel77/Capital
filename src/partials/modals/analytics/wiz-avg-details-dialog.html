<!-- МОДАЛЬНОЕ ОКНО: ДЕТАЛИЗАЦИЯ РАСЧЕТА СРЕДНИХ (ШАГ 2 И ШАГ 4) -->
<div
  id="wiz-avg-details-dialog"
  class="fixed inset-0 bg-black/85 z-[200] hidden flex flex-col justify-center items-center p-3 sm:p-4 backdrop-blur-sm animate-fade-in"
>
  <div
    class="bg-[#181B24] border border-[rgba(255,255,255,0.08)] w-full max-w-lg rounded-3xl shadow-2xl flex flex-col max-h-[90vh] overflow-hidden"
  >
    <!-- Шапка модального окна -->
    <div
      class="p-4 border-b border-[rgba(255,255,255,0.06)] bg-[#181B24] z-10 flex flex-col gap-2.5"
    >
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2.5 min-w-0">
          <div
            id="wiz-avg-icon-wrap"
            class="w-8 h-8 rounded-xl bg-[#6C5DD3]/15 text-[#727cff] flex items-center justify-center flex-shrink-0"
          >
            <i id="wiz-avg-header-icon" data-lucide="calculator" class="w-4 h-4"></i>
          </div>
          <div class="min-w-0">
            <h4 id="wiz-avg-title" class="text-sm font-bold text-white truncate">
              Детализация расчета
            </h4>
            <p id="wiz-avg-subtitle" class="text-[10px] text-[#848D99]">
              Настройте транзакции, учитываемые в расчете
            </p>
          </div>
        </div>
        <button
          type="button"
          onclick="closeWizAvgDetailsModal()"
          class="w-7 h-7 rounded-full bg-[#212430] text-gray-400 hover:text-white flex items-center justify-center cursor-pointer text-sm transition-colors"
        >
          ✕
        </button>
      </div>

      <!-- Компактная сводная плашка пересчета -->
      <div
        class="bg-[#12151C] border border-[rgba(255,255,255,0.06)] rounded-2xl p-2.5 sm:p-3 grid grid-cols-2 gap-2 divide-x divide-[rgba(255,255,255,0.05)]"
      >
        <!-- Левая колонка: Среднее в месяц -->
        <div class="min-w-0 pr-1">
          <span
            id="wiz-avg-type-label"
            class="text-[10px] text-[#848D99] uppercase font-bold tracking-wider truncate block"
            >Среднее в месяц</span
          >
          <div class="flex items-baseline gap-1 mt-0.5 min-w-0">
            <b
              id="wiz-avg-live-result"
              class="text-base sm:text-lg font-bold font-mono text-[#727cff] whitespace-nowrap"
              >~0 ₽</b
            >
            <span class="text-[10px] text-[#848D99] font-medium flex-shrink-0">/мес</span>
          </div>
          <div class="text-[10px] text-[#848D99] font-mono mt-0.5 truncate flex items-center gap-1">
            <i data-lucide="check-circle-2" class="w-3 h-3 text-[#727cff] flex-shrink-0"></i>
            <span id="wiz-avg-count-label" class="truncate">0 из 0 оп.</span>
          </div>
        </div>

        <!-- Правая колонка: Учтенная сумма за период -->
        <div class="min-w-0 pl-3 flex flex-col justify-between">
          <div>
            <span
              class="text-[10px] text-[#848D99] uppercase font-bold tracking-wider truncate block"
              >Сумма операций</span
            >
            <div class="mt-0.5">
              <span
                id="wiz-avg-total-sum"
                class="text-sm sm:text-base font-mono font-bold text-white whitespace-nowrap truncate block"
                >0 ₽</span
              >
            </div>
          </div>
          <div class="text-[10px] text-[#848D99] mt-0.5 truncate flex items-center gap-1">
            <i data-lucide="calendar" class="w-3 h-3 text-[#848D99] flex-shrink-0"></i>
            <span id="wiz-avg-period-badge" class="truncate">за 90 дн.</span>
          </div>
        </div>
      </div>

      <!-- Панель действий: Сортировка, Фильтр категорий, Выбрать/Снять все (растянута на всю ширину) -->
      <div class="w-full flex items-stretch gap-1.5 pt-1 text-[10px]">
        <!-- Сортировка -->
        <div id="wiz-avg-sort-wrap" class="flex-1 min-w-0 relative">
          <button
            type="button"
            id="wiz-avg-sort-btn"
            onclick="wizAvgToggleSortDropdown(event)"
            class="w-full h-8 bg-[#12151C] hover:bg-[#1A1D28] text-gray-200 border border-[rgba(255,255,255,0.08)] hover:border-[#727cff]/40 text-[10px] font-medium rounded-xl px-2 outline-none cursor-pointer transition-colors flex items-center justify-between gap-1 active:scale-[0.98]"
          >
            <div class="flex items-center gap-1 min-w-0 flex-1 truncate">
              <i data-lucide="arrow-up-down" class="w-3 h-3 text-gray-400 flex-shrink-0"></i>
              <span id="wiz-avg-sort-label" class="truncate font-medium">Дата (новые)</span>
            </div>
            <i data-lucide="chevron-down" class="w-2.5 h-2.5 text-gray-400 flex-shrink-0"></i>
          </button>

          <!-- Выпадающее кастомное меню сортировки -->
          <div
            id="wiz-avg-sort-menu"
            class="hidden absolute left-0 top-full mt-1.5 z-[200] bg-[#1A1D28] border border-[rgba(255,255,255,0.12)] rounded-2xl shadow-2xl py-1 w-44 text-[11px] backdrop-blur-md animate-fade-in"
          >
            <button
              type="button"
              onclick="wizAvgSelectSort('date-desc')"
              class="wiz-sort-opt flex items-center justify-between w-full px-2.5 py-1.5 text-left hover:bg-[#252836] transition-colors text-gray-200 cursor-pointer"
              data-value="date-desc"
            >
              <span>Дата (сначала новые)</span>
              <i data-lucide="check" class="w-3 h-3 text-[#727cff] opt-check hidden"></i>
            </button>
            <button
              type="button"
              onclick="wizAvgSelectSort('date-asc')"
              class="wiz-sort-opt flex items-center justify-between w-full px-2.5 py-1.5 text-left hover:bg-[#252836] transition-colors text-gray-200 cursor-pointer"
              data-value="date-asc"
            >
              <span>Дата (сначала старые)</span>
              <i data-lucide="check" class="w-3 h-3 text-[#727cff] opt-check hidden"></i>
            </button>
            <div class="my-0.5 border-t border-[rgba(255,255,255,0.06)]"></div>
            <button
              type="button"
              onclick="wizAvgSelectSort('amount-desc')"
              class="wiz-sort-opt flex items-center justify-between w-full px-2.5 py-1.5 text-left hover:bg-[#252836] transition-colors text-gray-200 cursor-pointer"
              data-value="amount-desc"
            >
              <span>Сумма (от большей)</span>
              <i data-lucide="check" class="w-3 h-3 text-[#727cff] opt-check hidden"></i>
            </button>
            <button
              type="button"
              onclick="wizAvgSelectSort('amount-asc')"
              class="wiz-sort-opt flex items-center justify-between w-full px-2.5 py-1.5 text-left hover:bg-[#252836] transition-colors text-gray-200 cursor-pointer"
              data-value="amount-asc"
            >
              <span>Сумма (от меньшей)</span>
              <i data-lucide="check" class="w-3 h-3 text-[#727cff] opt-check hidden"></i>
            </button>
          </div>
        </div>

        <!-- Кнопка Фильтр Категорий (Popover) -->
        <div id="wiz-avg-cat-filter-wrap" class="flex-1 min-w-0 relative hidden">
          <button
            type="button"
            id="wiz-avg-cat-filter-btn"
            onclick="wizAvgToggleCatFilterDropdown(event)"
            class="w-full h-8 bg-[#12151C] hover:bg-[#1A1D28] text-gray-200 border border-[rgba(255,255,255,0.08)] hover:border-[#727cff]/40 text-[10px] font-medium rounded-xl px-2 outline-none cursor-pointer transition-colors flex items-center justify-between gap-1 active:scale-[0.98]"
          >
            <div class="flex items-center gap-1 min-w-0 flex-1 truncate">
              <i data-lucide="filter" class="w-3 h-3 text-[#727cff] flex-shrink-0"></i>
              <span id="wiz-avg-cat-filter-label" class="truncate font-medium">Все категории</span>
            </div>
            <i data-lucide="chevron-down" class="w-2.5 h-2.5 text-gray-400 flex-shrink-0"></i>
          </button>

          <!-- Выпадающий поповер со списком категорий -->
          <div
            id="wiz-avg-cat-filter-menu"
            class="hidden absolute right-0 sm:left-0 top-full mt-1.5 z-[200] bg-[#1A1D28] border border-[rgba(255,255,255,0.12)] rounded-2xl shadow-2xl p-2 w-64 text-xs backdrop-blur-md animate-fade-in flex flex-col gap-1"
          >
            <div
              class="flex items-center justify-between px-1.5 py-1 border-b border-[rgba(255,255,255,0.06)] mb-0.5"
            >
              <span class="text-[10px] uppercase font-bold text-[#848D99] tracking-wider"
                >Категории</span
              >
              <button
                type="button"
                id="wiz-avg-cat-toggle-all-btn"
                onclick="wizAvgToggleAllFilterCategories(event)"
                class="bg-[#12151C] hover:bg-[#212430] text-gray-200 hover:text-white border border-[rgba(255,255,255,0.08)] hover:border-[#727cff]/40 text-[10px] font-medium rounded-lg px-2 py-0.5 flex items-center justify-center gap-1 cursor-pointer transition-colors active:scale-95"
                title="Выбрать все / Снять выделение"
              >
                <i
                  id="wiz-avg-cat-toggle-all-icon"
                  data-lucide="check-check"
                  class="w-3 h-3 text-[#727cff] flex-shrink-0"
                ></i>
                <span id="wiz-avg-cat-toggle-all-label" class="font-medium">Все</span>
              </button>
            </div>
            <div
              id="wiz-avg-cat-filter-list"
              class="max-h-56 overflow-y-auto space-y-1 custom-scrollbar pr-0.5"
            >
              <!-- Динамические строки категорий с чекбоксами -->
            </div>
          </div>
        </div>

        <!-- Единая компактная кнопка переключения выбора всех операций -->
        <div id="wiz-avg-toggle-all-wrap" class="w-16 sm:w-20 flex-shrink-0">
          <button
            type="button"
            id="wiz-avg-toggle-all-btn"
            onclick="wizAvgToggleSelectAll()"
            class="w-full h-8 bg-[#12151C] hover:bg-[#212430] text-gray-200 hover:text-white border border-[rgba(255,255,255,0.08)] hover:border-[#727cff]/40 text-[10px] font-medium rounded-xl px-1.5 flex items-center justify-center gap-1 cursor-pointer transition-colors active:scale-95"
            title="Выбрать все / Снять выделение"
          >
            <i
              id="wiz-avg-toggle-all-icon"
              data-lucide="check-check"
              class="w-3 h-3 text-[#727cff] flex-shrink-0"
            ></i>
            <span id="wiz-avg-toggle-all-label" class="truncate font-medium">Все</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Список транзакций с чекбоксами (стилизованный под карточки трат) -->
    <div id="wiz-avg-tx-list" class="flex-1 overflow-y-auto p-3 space-y-2 custom-scrollbar"></div>

    <!-- Подвал с кнопками применения -->
    <div
      class="p-3.5 border-t border-[rgba(255,255,255,0.06)] bg-[#181B24] flex items-center gap-2"
    >
      <button
        type="button"
        id="wiz-avg-delete-cat-btn"
        onclick="deleteCurrentWizCategory()"
        class="hidden w-10 h-10 bg-[#FF453A]/15 hover:bg-[#FF453A]/25 text-[#FF453A] border border-[#FF453A]/20 rounded-xl transition-all cursor-pointer flex items-center justify-center active:scale-95 flex-shrink-0"
        title="Удалить категорию из лимитов"
      >
        <i data-lucide="trash-2" class="w-4 h-4"></i>
      </button>

      <button
        type="button"
        onclick="closeWizAvgDetailsModal()"
        class="flex-1 h-10 bg-[#212430] hover:bg-[#2A2D3C] text-gray-300 rounded-xl text-xs font-semibold cursor-pointer transition-colors flex items-center justify-center active:scale-95"
      >
        Отмена
      </button>
      <button
        type="button"
        onclick="applyWizAvgDetailsResult()"
        id="wiz-avg-apply-btn"
        class="flex-1 h-10 bg-[#6C5DD3] hover:bg-[#5b4ec2] text-white rounded-xl text-xs font-bold shadow-lg shadow-[#6C5DD3]/20 active:scale-95 cursor-pointer transition-all flex items-center justify-center px-2"
      >
        <span>Применить среднее</span>
      </button>
    </div>
  </div>
</div>
