<!-- МОДАЛЬНОЕ ОКНО: ВЫБОР КАТЕГОРИИ ДЛЯ ЛИМИТА В МАСТЕРЕ (ШАГ 4) -->
<div
  id="wiz-category-picker-dialog"
  class="fixed inset-0 bg-black/80 z-[180] hidden flex flex-col justify-center items-center p-4 backdrop-blur-sm animate-fade-in"
>
  <div
    class="bg-[#181B24] border border-[rgba(255,255,255,0.08)] w-full max-w-sm rounded-3xl p-5 shadow-2xl"
  >
    <div
      class="flex items-center justify-between pb-3 mb-3 border-b border-[rgba(255,255,255,0.06)]"
    >
      <h4 class="text-sm font-bold text-white">Добавить категорию в лимиты</h4>
      <button
        type="button"
        onclick="closeAddCategoryLimitPicker()"
        class="w-7 h-7 rounded-full bg-[#212430] text-gray-400 hover:text-white flex items-center justify-center cursor-pointer text-sm"
      >
        ✕
      </button>
    </div>
    <div id="wiz-category-picker-list" class="space-y-1.5 max-h-64 overflow-y-auto pr-1"></div>
    <div class="mt-4 pt-3 border-t border-[rgba(255,255,255,0.06)]">
      <button
        type="button"
        onclick="closeAddCategoryLimitPicker()"
        class="w-full bg-[#212430] hover:bg-[#2A2D3C] text-gray-300 py-2.5 rounded-xl text-xs font-semibold cursor-pointer transition-colors"
      >
        Закрыть
      </button>
    </div>
  </div>
</div>
