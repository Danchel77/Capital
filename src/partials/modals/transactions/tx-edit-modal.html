<!-- МОДАЛЬНОЕ ОКНО РЕДАКТИРОВАНИЯ ОПЕРАЦИИ (ТРАНЗАКЦИИ) -->
<div
  id="tx-edit-modal"
  onclick="if (event.target === this) closeEditTxModal();"
  class="fixed inset-0 bg-black/85 z-[150] hidden flex flex-col justify-center items-center p-3.5 sm:p-4 backdrop-blur-sm animate-fade-in"
>
  <div
    class="bg-[#0E1016] border border-white/10 w-full max-w-sm rounded-3xl p-5 shadow-2xl max-h-[92dvh] flex flex-col"
  >
    <!-- Шапка модального окна -->
    <div
      class="flex items-center justify-between mb-3.5 pb-2.5 border-b border-white/[0.06] flex-shrink-0"
    >
      <div>
        <h3 id="tx-edit-modal-title" class="font-bold text-white text-base">
          Редактирование операции
        </h3>
        <p id="tx-edit-modal-subtitle" class="text-xs text-zinc-400 mt-0.5 hidden"></p>
      </div>
      <button
        type="button"
        id="tx-edit-modal-close-btn"
        onclick="closeEditTxModal()"
        class="w-8 h-8 rounded-xl bg-white/[0.05] hover:bg-white/10 text-zinc-400 hover:text-white border border-white/[0.08] flex items-center justify-center cursor-pointer transition-colors active:scale-95"
      >
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>

    <form
      id="edit-tx-form"
      onsubmit="submitEditTxModal(event)"
      class="overflow-y-auto overflow-x-hidden overscroll-contain flex-1 flex flex-col min-h-0"
    >
      <input type="hidden" id="edit-tx-id" value="" />
      <input type="hidden" id="edit-tx-type" value="Расход" />
      <input type="hidden" id="edit-tx-bill-id" value="" />
      <input type="hidden" id="edit-tx-bill-name" value="" />
      <input type="hidden" id="edit-tx-is-bill-payment" value="false" />

      <!-- Переключатель типа: Расход / Доход -->
      <div class="flex bg-[#12151C] p-1 rounded-xl mb-3 border border-white/[0.06] flex-shrink-0">
        <button
          type="button"
          id="edit-tx-type-expense"
          onclick="setEditTxType('Расход')"
          class="flex-1 py-1.5 text-xs font-semibold rounded-lg transition-all text-white bg-white/10 border border-white/10 cursor-pointer shadow-sm"
        >
          Расход
        </button>
        <button
          type="button"
          id="edit-tx-type-income"
          onclick="setEditTxType('Доход')"
          class="flex-1 py-1.5 text-xs font-semibold rounded-lg transition-all text-zinc-400 hover:text-white border border-transparent cursor-pointer"
        >
          Доход
        </button>
      </div>

      <!-- Поле ввода суммы без лишней надписи -->
      <div class="mb-3 flex-shrink-0">
        <input
          type="text"
          inputmode="decimal"
          oninput="
            formatSumInput(this);
            handleEditTxAmountChange();
          "
          id="edit-tx-amount"
          placeholder="0 ₽"
          required
          class="w-full h-12 bg-[#12151C] border border-white/10 focus:border-white/30 text-white text-xl font-bold rounded-xl px-3.5 outline-none tracking-wide transition-colors placeholder-zinc-500"
        />
      </div>

      <!-- Компактная строка в 2 колонки: Дата + Категория -->
      <div class="grid grid-cols-[140px_1fr] gap-2 mb-3 flex-shrink-0">
        <!-- Дата операции: кнопка-плашка 1-в-1 по стилю с категорией -->
        <div class="relative min-w-0">
          <button
            type="button"
            id="edit-tx-date-btn"
            onclick="openCustomDatePicker(document.getElementById('edit-tx-date'))"
            class="w-full h-10 bg-[#12151C] border border-white/10 hover:border-white/20 text-white rounded-xl px-2.5 text-xs flex items-center gap-2 outline-none cursor-pointer transition-colors select-none"
          >
            <i data-lucide="calendar" class="w-4 h-4 text-zinc-400 flex-shrink-0"></i>
            <span id="edit-tx-date-label" class="text-xs text-white truncate font-normal">...</span>
            <input type="hidden" id="edit-tx-date" data-datepicker="true" value="" />
          </button>
        </div>

        <!-- Категория с кастомным меню -->
        <div class="relative custom-dropdown-wrap min-w-0" id="wrap-edit-tx-cat">
          <input type="hidden" id="edit-tx-category" required value="" />
          <button
            type="button"
            id="edit-tx-category-btn"
            onclick="toggleEditTxCategoryMenu(event)"
            class="w-full h-10 bg-[#12151C] border border-white/10 focus:border-white/30 text-white rounded-xl px-2.5 text-xs flex items-center justify-between outline-none cursor-pointer hover:border-white/20 transition-colors"
          >
            <span
              id="edit-tx-category-label"
              class="flex items-center gap-1.5 truncate text-white min-w-0"
            >
              <i data-lucide="tag" class="w-4 h-4 text-zinc-400 flex-shrink-0"></i>
              <span class="truncate text-zinc-200">Категория</span>
            </span>
            <span class="text-zinc-500 text-[8px] ml-1 flex-shrink-0">▼</span>
          </button>
          <div
            id="edit-tx-category-menu"
            class="custom-dropdown-menu hidden absolute left-0 right-0 top-full mt-1.5 w-full min-w-0 max-h-48 overflow-y-auto bg-[#0E1016] border border-white/10 rounded-2xl shadow-2xl z-[160] p-1 space-y-0.5 backdrop-blur-xl"
          ></div>
        </div>
      </div>

      <!-- Магазин или назначение платежа + булавка сохранения в словарь -->
      <div class="mb-3 flex-shrink-0">
        <div class="flex items-center gap-2">
          <input
            type="text"
            id="edit-tx-comment"
            oninput="handleEditTxCommentInput(this)"
            placeholder="Магазин или назначение платежа"
            class="flex-1 min-w-0 h-10 bg-[#12151C] border border-white/10 focus:border-white/30 text-white placeholder-zinc-500 rounded-xl px-3 outline-none text-xs transition-colors"
          />
          <button
            type="button"
            onclick="openRememberRuleForEditTx()"
            class="w-10 h-10 rounded-xl bg-white/[0.05] hover:bg-white/10 active:scale-90 text-zinc-400 hover:text-white border border-white/[0.08] flex items-center justify-center flex-shrink-0 cursor-pointer transition-all shadow-sm group"
            title="Запомнить в словарь категорий"
          >
            <i
              data-lucide="pin"
              class="w-4 h-4 -rotate-45 transition-transform group-hover:scale-110 pointer-events-none"
            ></i>
          </button>
        </div>
      </div>

      <!-- Кнопки действий: Удалить | Отмена | Сохранить -->
      <div class="flex items-center gap-2 pt-1 flex-shrink-0">
        <button
          type="button"
          id="edit-tx-delete-btn"
          onclick="deleteTxFromModal()"
          class="px-3.5 h-10 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 rounded-xl text-xs font-semibold transition-colors cursor-pointer flex items-center justify-center gap-1.5 active:scale-95"
          title="Удалить операцию"
        >
          <i data-lucide="trash-2" class="w-4 h-4"></i>
          <span>Удалить</span>
        </button>
        <button
          type="button"
          id="edit-tx-cancel-btn"
          onclick="closeEditTxModal()"
          class="flex-1 h-10 bg-white/[0.05] hover:bg-white/10 text-zinc-300 border border-white/[0.08] rounded-xl text-xs font-semibold transition-colors cursor-pointer active:scale-95"
        >
          Отмена
        </button>
        <button
          type="submit"
          id="edit-tx-save-btn"
          class="flex-1 h-10 bg-white hover:bg-zinc-200 text-zinc-950 rounded-xl text-xs font-semibold shadow-sm transition-all active:scale-95 cursor-pointer"
        >
          Сохранить
        </button>
      </div>
    </form>
  </div>
</div>
