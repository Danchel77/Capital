name: Update Live Market Rates

on:
  schedule:
    # Запуск каждый день в 03:00 по Москве (00:00 UTC)
    - cron: '0 0 * * *'
  workflow_dispatch: # Позволяет запускать вручную по кнопке в GitHub

jobs:
  update-rates:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Live Market Rates
        run: node scripts/update-market-rates.cjs

      - name: Commit and Push if updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/market-rates.json www/data/market-rates.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(rates): auto-update live market rates [skip ci]" && git push)
