name: Сборка Android APK

on:
  workflow_dispatch: # Запуск вручную по кнопке в GitHub Actions
  push:
    branches: [ main, master ] # Автоматическая сборка при пуше в основную ветку

jobs:
  build:
    name: Сборка APK (Capacitor Android)
    runs-on: ubuntu-latest

    steps:
      - name: 1. Клонирование репозитория
        uses: actions/checkout@v4

      - name: 2. Настройка Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Настройка Java JDK (v17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Установка зависимостей проекта и Capacitor
        run: |
          npm install --no-audit --no-fund
          npm install @capacitor/core @capacitor/cli @capacitor/android --no-audit --no-fund

      - name: 5. Инициализация и синхронизация Android платформы
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: 6. Сборка APK через Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 7. Загрузка готового APK в артефакты GitHub
        uses: actions/upload-artifact@v4
        with:
          name: FamilyBudget-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
