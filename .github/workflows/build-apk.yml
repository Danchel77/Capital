name: Сборка Android APK

on:
  workflow_dispatch: # Запуск вручную по кнопке в GitHub Actions
  push:
    branches: [ main, master ] # Автоматическая сборка при пуше в основную ветку

jobs:
  build:
    name: Сборка APK (Capacitor Android)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Клонирование репозитория
        uses: actions/checkout@v4

      - name: 2. Настройка Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Настройка Java JDK (v21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Установка зависимостей проекта и Capacitor
        run: |
          npm install --no-audit --no-fund
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @codetrix-studio/capacitor-google-auth@^3.4.0-rc.4 --no-audit --no-fund

      - name: 5. Синхронизация Android и подготовка постоянного Keystore
        run: |
          # 1. Подготовка чистой папки веб-ассетов www
          rm -rf www
          mkdir -p www
          cp -f index.html www/index.html
          cp -f *.js www/ 2>/dev/null || true
          cp -f *.css www/ 2>/dev/null || true
          cp -f *.json www/ 2>/dev/null || true
          cp -f *.svg www/ 2>/dev/null || true
          if [ -d "public" ]; then cp -r public/* www/ 2>/dev/null || true; fi

          if [ ! -f "www/index.html" ]; then
            echo "Критическая ошибка: www/index.html не найден!"
            exit 1
          fi

          echo "Содержимое папки www:"
          ls -la www/

          # 2. Подготовка постоянного Keystore подписи (один постоянный ключ для всего проекта)
          mkdir -p ~/.android
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Использование ключа из GitHub Secrets (KEYSTORE_BASE64)..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > debug.keystore
            cp debug.keystore ~/.android/debug.keystore
          elif [ -f "debug.keystore" ]; then
            echo "Использование постоянного debug.keystore из репозитория..."
            cp debug.keystore ~/.android/debug.keystore
          else
            echo "Внимание: debug.keystore не найден в репозитории. Создаем постоянный ключ..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=FamilyBudget Debug,O=App,C=RU"
            cp debug.keystore ~/.android/debug.keystore
            # Автоматически сохраняем ключ в репозиторий GitHub навсегда
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add debug.keystore
            git commit -m "chore: persist permanent debug.keystore for Google Auth" || true
            git push origin HEAD || echo "Не удалось сделать git push (проверьте права токена), но ключ сохранен в артефакты"
          fi

          # 3. Инициализация платформы Android
          # Если папка android неполная (нет build.gradle), пересоздаем ее через Capacitor
          if [ -d "android" ] && [ ! -f "android/build.gradle" ]; then
            echo "Обнаружена неполная папка android (нет build.gradle). Очищаем для npx cap add android..."
            rm -rf android
          fi

          if [ ! -d "android" ]; then
            echo "Добавление платформы Android через Capacitor..."
            npx cap add android
          fi

          mkdir -p android/app
          # Копируем постоянный debug.keystore в каталог приложения Android
          cp ~/.android/debug.keystore android/app/debug.keystore

          # Копируем google-services.json
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
          fi

          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

          # Автоматическая генерация фирменной иконки Android из icon.svg во все папки mipmap
          npm install -D sharp --no-audit --no-fund
          node -e "
            const sharp = require('sharp');
            const fs = require('fs');
            const path = require('path');
            const mipmaps = [
              { dir: 'mipmap-mdpi', size: 48 },
              { dir: 'mipmap-hdpi', size: 72 },
              { dir: 'mipmap-xhdpi', size: 96 },
              { dir: 'mipmap-xxhdpi', size: 144 },
              { dir: 'mipmap-xxxhdpi', size: 192 }
            ];
            async function run() {
              const svgBuf = fs.readFileSync('icon.svg');
              for (const item of mipmaps) {
                const targetDir = path.join('android/app/src/main/res', item.dir);
                if (!fs.existsSync(targetDir)) fs.mkdirSync(targetDir, { recursive: true });
                const imgBuf = await sharp(svgBuf).resize(item.size, item.size).png().toBuffer();
                fs.writeFileSync(path.join(targetDir, 'ic_launcher.png'), imgBuf);
                fs.writeFileSync(path.join(targetDir, 'ic_launcher_round.png'), imgBuf);
                fs.writeFileSync(path.join(targetDir, 'ic_launcher_foreground.png'), imgBuf);
              }
              console.log('Фирменная иконка успешно создана для всех разрешений!');
            }
            run();
          "

          # 4. Синхронизация веб-ресурсов в Android
          npx cap sync android

          # Внедряем нативные виджеты Android (AppWidgetProvider, RemoteViews, WidgetPinPlugin)
          if [ -f "scripts/setup-android-widgets.js" ]; then
            node scripts/setup-android-widgets.js
          fi

          # Внедряем server_client_id в strings.xml для плагина GoogleAuth на Android
          STRINGS_XML="android/app/src/main/res/values/strings.xml"
          if [ -f "$STRINGS_XML" ]; then
            if ! grep -q "server_client_id" "$STRINGS_XML"; then
              echo "Добавление server_client_id в strings.xml..."
              sed -i 's|</resources>|    <string name="server_client_id">129164761119-0collp5th27qd9o4ah8dronfctcfp3pv.apps.googleusercontent.com</string>\n</resources>|' "$STRINGS_XML"
            fi
          fi

          # Гарантируем подключение плагина google-services в android/app/build.gradle
          APP_GRADLE="android/app/build.gradle"
          if [ -f "$APP_GRADLE" ]; then
            if ! grep -q "com.google.gms.google-services" "$APP_GRADLE"; then
              echo "Подключение com.google.gms.google-services в app/build.gradle..."
              echo "apply plugin: 'com.google.gms.google-services'" >> "$APP_GRADLE"
            fi
          fi

          ROOT_GRADLE="android/build.gradle"
          if [ -f "$ROOT_GRADLE" ]; then
            if ! grep -q "com.google.gms:google-services" "$ROOT_GRADLE"; then
              echo "Добавление google-services classpath в корневой build.gradle..."
              sed -i "/dependencies {/a \        classpath 'com.google.gms:google-services:4.4.2'" "$ROOT_GRADLE"
            fi
          fi

          # Гарантируем явную привязку debug.keystore в signingConfigs app/build.gradle
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore 2>/dev/null || true
          mkdir -p android/app
          cp ~/.android/debug.keystore android/app/debug.keystore

          node -e "
            const fs = require('fs');
            const gradlePath = 'android/app/build.gradle';
            if (fs.existsSync(gradlePath)) {
              let content = fs.readFileSync(gradlePath, 'utf8');
              if (!content.includes('signingConfigs.debug.storeFile')) {
                content = content.replace('buildTypes {', [
                  'signingConfigs {',
                  '    debug {',
                  '        storeFile file(\"debug.keystore\")',
                  '        storePassword \"android\"',
                  '        keyAlias \"androiddebugkey\"',
                  '        keyPassword \"android\"',
                  '    }',
                  '}',
                  'buildTypes {'
                ].join('\n'));
                content = content.replace(/signingConfig signingConfigs\.debug/g, 'signingConfig signingConfigs.debug');
                fs.writeFileSync(gradlePath, content);
                console.log('Явная подпись signingConfigs.debug успешно внедрена в app/build.gradle');
              }
            }
          "

      - name: 6. Проверка постоянных отпечатков SHA-1 и SHA-256
        run: |
          echo "============================================================"
          echo "ПОСТОЯННЫЙ ОТПЕЧАТОК СЕРТИФИКАТА ДЛЯ FIREBASE:"
          echo "Зарегистрируйте этот SHA-1 в Firebase Console (Настройки проекта -> com.budget.family):"
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1:|SHA256:" || true
          echo "============================================================"

      - name: 7. Сборка APK через Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk FamilyBudget.apk
          echo "Отпечаток сертификата РЕАЛЬНОГО собранного APK:"
          keytool -printcert -jarfile FamilyBudget.apk | grep -E "SHA1:|SHA256:" || true

      - name: 8. Загрузка готового APK в артефакты GitHub
        uses: actions/upload-artifact@v4
        with:
          name: FamilyBudget-Android-APK
          path: FamilyBudget.apk
          if-no-files-found: error
          retention-days: 30

      - name: 9. Сохранение файла ключа подписи (debug.keystore) в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: debug-keystore
          path: debug.keystore
          if-no-files-found: ignore
          retention-days: 90

      - name: 10. Публикация APK в GitHub Releases (постоянная ссылка)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: latest
          name: "Family Budget Android App"
          body: "Последняя актуальная версия APK приложения «Бюджет» для Android."
          draft: false
          prerelease: false
          files: FamilyBudget.apk
          token: ${{ secrets.GITHUB_TOKEN }}
