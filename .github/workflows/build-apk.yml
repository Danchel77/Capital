name: Сборка Android APK

on:
  workflow_dispatch: # Запуск вручную по кнопке в GitHub Actions
  push:
    branches: [ main, master ] # Автоматическая сборка при пуше в основную ветку

jobs:
  build:
    name: Сборка APK (Capacitor Android)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Клонирование репозитория
        uses: actions/checkout@v4

      - name: 2. Настройка Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Настройка Java JDK (v21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Установка зависимостей проекта и Capacitor
        run: |
          npm install --no-audit --no-fund
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @codetrix-studio/capacitor-google-auth --no-audit --no-fund

      - name: 5. Генерация иконок и синхронизация Android платформы
        run: |
          mkdir -p www
          cp -r *.html *.js *.css *.json *.svg www/ 2>/dev/null || true
          if [ -d "public" ]; then cp -r public/* www/ 2>/dev/null || true; fi
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

          # Автоматическая генерация фирменной иконки Android из icon.svg во все папки mipmap
          npm install -D sharp --no-audit --no-fund
          node -e "
            const sharp = require('sharp');
            const fs = require('fs');
            const path = require('path');
            const mipmaps = [
              { dir: 'mipmap-mdpi', size: 48 },
              { dir: 'mipmap-hdpi', size: 72 },
              { dir: 'mipmap-xhdpi', size: 96 },
              { dir: 'mipmap-xxhdpi', size: 144 },
              { dir: 'mipmap-xxxhdpi', size: 192 }
            ];
            async function run() {
              const svgBuf = fs.readFileSync('icon.svg');
              for (const item of mipmaps) {
                const targetDir = path.join('android/app/src/main/res', item.dir);
                if (!fs.existsSync(targetDir)) fs.mkdirSync(targetDir, { recursive: true });
                const imgBuf = await sharp(svgBuf).resize(item.size, item.size).png().toBuffer();
                fs.writeFileSync(path.join(targetDir, 'ic_launcher.png'), imgBuf);
                fs.writeFileSync(path.join(targetDir, 'ic_launcher_round.png'), imgBuf);
                fs.writeFileSync(path.join(targetDir, 'ic_launcher_foreground.png'), imgBuf);
              }
              console.log('Фирменная иконка успешно создана для всех разрешений!');
            }
            run();
          "

          npx cap sync android

      - name: 6. Подготовка ключа подписи и вывод SHA-1 для Firebase
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=FamilyBudget Debug,O=App,C=RU"
          fi
          echo "============================================================"
          echo "ОТПЕЧАТОК SHA-1 ДЛЯ ВСТАВКИ В FIREBASE CONSOLE:"
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep "SHA1:" || true
          echo "============================================================"

      - name: 7. Сборка APK через Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk FamilyBudget.apk

      - name: 7. Загрузка готового APK в артефакты GitHub
        uses: actions/upload-artifact@v4
        with:
          name: FamilyBudget-Android-APK
          path: FamilyBudget.apk
          if-no-files-found: error
          retention-days: 30

      - name: 8. Публикация APK в GitHub Releases (постоянная ссылка)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: latest
          name: "Family Budget Android App"
          body: "Последняя актуальная версия APK приложения «Бюджет» для Android."
          draft: false
          prerelease: false
          files: FamilyBudget.apk
          token: ${{ secrets.GITHUB_TOKEN }}
