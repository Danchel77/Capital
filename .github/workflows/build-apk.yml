name: Сборка Android APK

on:
  workflow_dispatch: # Запуск вручную по кнопке в GitHub Actions
  push:
    branches: [ main, master ] # Автоматическая сборка при пуше в основную ветку

jobs:
  build:
    name: Сборка APK (Capacitor Android)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 1. Клонирование репозитория
        uses: actions/checkout@v4

      - name: 2. Настройка Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Настройка Java JDK (v21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 4. Установка зависимостей проекта и Capacitor
        run: |
          npm install --no-audit --no-fund
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @codetrix-studio/capacitor-google-auth --no-audit --no-fund

      - name: 5. Генерация иконок, google-services.json и синхронизация Android
        run: |
          mkdir -p www
          cp -r *.html *.js *.css *.json *.svg www/ 2>/dev/null || true
          if [ -d "public" ]; then cp -r public/* www/ 2>/dev/null || true; fi

          # Подготовка постоянного Keystore подписи
          mkdir -p ~/.android
          if [ -f "debug.keystore" ]; then
            echo "Использование постоянного debug.keystore из репозитория..."
            cp debug.keystore ~/.android/debug.keystore
          else
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=FamilyBudget Debug,O=App,C=RU"
          fi

          if [ ! -d "android" ]; then
            npx cap add android
          fi

          # Создаем google-services.json для нативных сервисов Google
          cat << 'EOF' > android/app/google-services.json
          {
            "project_info": {
              "project_number": "129164761119",
              "project_id": "familybudget-4245a",
              "storage_bucket": "familybudget-4245a.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:129164761119:android:faa150210d218fc5655d2a",
                  "android_client_info": {
                    "package_name": "com.budget.family"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "129164761119-15vpls8k7ejo2eov8g8ohcs6ckgo8sm1.apps.googleusercontent.com",
                    "client_type": 1,
                    "android_info": {
                      "package_name": "com.budget.family",
                      "certificate_hash": "5e8f16062ea3cd2c4a0d547876baa6f38cabf625"
                    }
                  },
                  {
                    "client_id": "129164761119-b2ujsfs8v997edgsn1tusgnrf74vp9f5.apps.googleusercontent.com",
                    "client_type": 1,
                    "android_info": {
                      "package_name": "com.budget.family",
                      "certificate_hash": "e4aef9b7dcf83b807fe4ec2f59dfcd34902bfd34"
                    }
                  },
                  {
                    "client_id": "129164761119-fbebdjrt84r7kj2lnikrt5khqr5sosqu.apps.googleusercontent.com",
                    "client_type": 1,
                    "android_info": {
                      "package_name": "com.budget.family",
                      "certificate_hash": "486f4e17c2354e67e41a519f2908127aac18b4e3"
                    }
                  },
                  {
                    "client_id": "129164761119-q58s6fl94falkmc5r1rk8foruuuf1371.apps.googleusercontent.com",
                    "client_type": 1,
                    "android_info": {
                      "package_name": "com.budget.family",
                      "certificate_hash": "8d2e6200c42843e49b289ae65fc6e4d77ddb43d5"
                    }
                  },
                  {
                    "client_id": "129164761119-vjlf516ig0qhdjb4j9vq8kga3s7nqq7s.apps.googleusercontent.com",
                    "client_type": 1,
                    "android_info": {
                      "package_name": "com.budget.family",
                      "certificate_hash": "daee4a46f1736f8b377cf6ca7c413cbf4887c36c"
                    }
                  },
                  {
                    "client_id": "129164761119-0collp5th27qd9o4ah8dronfctcfp3pv.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyDTUV5e1TW4-P3eLvMktfOfT0Q4WatELcU"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "129164761119-0collp5th27qd9o4ah8dronfctcfp3pv.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

          # Автоматическая генерация фирменной иконки Android из icon.svg во все папки mipmap
          npm install -D sharp --no-audit --no-fund
          node -e "
            const sharp = require('sharp');
            const fs = require('fs');
            const path = require('path');
            const mipmaps = [
              { dir: 'mipmap-mdpi', size: 48 },
              { dir: 'mipmap-hdpi', size: 72 },
              { dir: 'mipmap-xhdpi', size: 96 },
              { dir: 'mipmap-xxhdpi', size: 144 },
              { dir: 'mipmap-xxxhdpi', size: 192 }
            ];
            async function run() {
              const svgBuf = fs.readFileSync('icon.svg');
              for (const item of mipmaps) {
                const targetDir = path.join('android/app/src/main/res', item.dir);
                if (!fs.existsSync(targetDir)) fs.mkdirSync(targetDir, { recursive: true });
                const imgBuf = await sharp(svgBuf).resize(item.size, item.size).png().toBuffer();
                fs.writeFileSync(path.join(targetDir, 'ic_launcher.png'), imgBuf);
                fs.writeFileSync(path.join(targetDir, 'ic_launcher_round.png'), imgBuf);
                fs.writeFileSync(path.join(targetDir, 'ic_launcher_foreground.png'), imgBuf);
              }
              console.log('Фирменная иконка успешно создана для всех разрешений!');
            }
            run();
          "

          npx cap sync android

      - name: 6. Проверка отпечатка SHA-1
        run: |
          echo "============================================================"
          echo "ОТПЕЧАТОК SHA-1 ДЛЯ FIREBASE:"
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android | grep "SHA1:" || true
          echo "============================================================"

      - name: 7. Сборка APK через Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk FamilyBudget.apk

      - name: 7. Загрузка готового APK в артефакты GitHub
        uses: actions/upload-artifact@v4
        with:
          name: FamilyBudget-Android-APK
          path: FamilyBudget.apk
          if-no-files-found: error
          retention-days: 30

      - name: 8. Публикация APK в GitHub Releases (постоянная ссылка)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: latest
          name: "Family Budget Android App"
          body: "Последняя актуальная версия APK приложения «Бюджет» для Android."
          draft: false
          prerelease: false
          files: FamilyBudget.apk
          token: ${{ secrets.GITHUB_TOKEN }}
