<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Vibrant App Store / Google Play style gradient -->
    <linearGradient id="appBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C65FF"/>
      <stop offset="45%" stop-color="#6352F7"/>
      <stop offset="100%" stop-color="#4834DF"/>
    </linearGradient>

    <!-- Top glass reflection highlight -->
    <linearGradient id="glossHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Gold & Emerald card accents -->
    <linearGradient id="cardAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <!-- Coin Gold Gradient -->
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- App Icon Outer Rim -->
    <linearGradient id="appBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.45)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.1)"/>
    </linearGradient>
  </defs>

  <!-- iOS / Material 3 Squircle App Icon Base -->
  <rect x="8" y="8" width="496" height="496" rx="116" fill="url(#appBgGrad)"/>
  
  <!-- Subtle inner glass rim highlight -->
  <rect x="8" y="8" width="496" height="496" rx="116" fill="none" stroke="url(#appBorder)" stroke-width="6"/>
  <path d="M16 124 C16 60, 60 16, 124 16 L388 16 C452 16, 496 60, 496 124 L496 220 C350 200, 160 210, 16 260 Z" fill="url(#glossHighlight)"/>

  <!-- Centered Professional Fintech Emblem (Wallet + Card + Gold Accent) -->
  <g transform="translate(88, 88) scale(14.083)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Bank Card emerging from the wallet -->
    <rect x="5.5" y="3" width="13" height="7" rx="1.6" fill="url(#cardAccentGrad)" stroke="#E0E7FF" stroke-width="0.7"/>
    <line x1="5.5" y1="5.6" x2="18.5" y2="5.6" stroke="#1E1B4B" stroke-width="0.9"/>
    <rect x="7.2" y="7.2" width="2.2" height="1.6" rx="0.4" fill="#FDE047" stroke="none"/>

    <!-- Main Wallet Body (Authentic Lucide Geometry with Crisp Pure White Stroke) -->
    <path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"
          fill="#2E1065" fill-opacity="0.3" stroke="#FFFFFF" stroke-width="1.75"/>
    <path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"
          fill="#2E1065" fill-opacity="0.3" stroke="#FFFFFF" stroke-width="1.75"/>

    <!-- Golden Lock/Clasp Accent Coin -->
    <circle cx="18" cy="13" r="1.1" fill="url(#coinGrad)" stroke="#FFFFFF" stroke-width="0.5"/>
  </g>
</svg>